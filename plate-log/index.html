
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plate Log</title>
<meta name="theme-color" content="#16181d">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plate Log">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#authGate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px}
#authGate[hidden]{display:none}
#authGate .box{width:100%;max-width:380px;background:var(--surface);border-radius:18px;padding:24px 20px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
#authGate h1{font-family:"Barlow Condensed",sans-serif;font-size:40px;margin:0 0 4px;letter-spacing:.5px}
#authGate h1 i{color:var(--accent);font-style:normal}
#authGate p{color:var(--muted);margin:0 0 16px;font-size:14px;line-height:1.4}
#authGate label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
#authGate input{width:100%;box-sizing:border-box;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--ink)}
#authGate button{width:100%;margin-top:18px;font-size:17px;font-weight:700;padding:13px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink)}
#authGate .link{background:none;color:var(--accent);font-weight:600;font-size:14px;margin-top:10px;padding:6px}
#authGate .err{color:var(--accent);font-size:14px;margin-top:10px;min-height:18px}
.signout{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:6px 0}
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --surface2:#F5F6F8; --ink:#15181C; --muted:#68707B; --line:#D9DDE2;
  --accent:#D1362A; --accent-ink:#FFFFFF; --accent-soft:#FBE7E4; --eq-fill:#B7C1CC; --eq-line:#56616D; --warm:#E8912D; --mbase:#CDD3DA; --done:#1F8A55; --done-soft:#E1F3E9;
  --shadow:0 1px 2px rgba(20,24,28,.06),0 4px 14px rgba(20,24,28,.05);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1113; --surface:#1A1D21; --surface2:#22262B; --ink:#EDEFF2; --muted:#9AA2AD; --line:#2E333A;
    --accent:#FF5B4B; --accent-ink:#1A0A08; --accent-soft:#3A1C19; --eq-fill:#4B5560; --eq-line:#A3AEBA; --warm:#F2A54A; --mbase:#3A424C; --done:#46C585; --done-soft:#15301F;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1113; --surface:#1A1D21; --surface2:#22262B; --ink:#EDEFF2; --muted:#9AA2AD; --line:#2E333A;
  --accent:#FF5B4B; --accent-ink:#1A0A08; --accent-soft:#3A1C19; --eq-fill:#4B5560; --eq-line:#A3AEBA; --warm:#F2A54A; --mbase:#3A424C; --done:#46C585; --done-soft:#15301F;
  --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 150px;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.01em;line-height:1;text-transform:uppercase}
.brand span{color:var(--accent)}
.stat.wide{grid-column:1/-1}
.kc{flex:none;text-align:right;font-weight:700;font-size:15px;line-height:1.1;color:var(--accent)}
.kc small{font-size:11px;font-weight:600;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:100%}
.stepwrap{display:flex;flex-direction:column;gap:3px}
.stepwrap small{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-left:2px}
.step{justify-content:space-between;min-width:0;gap:2px}
.stepwrap{min-width:0}
.steps .step button{width:30px;flex:none}
.steps .step span{min-width:0;flex:1;font-size:13px}
.seg{align-self:flex-start}
.profiles{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.pchip{flex:none;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:700;font-size:14px}
.pchip .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted);font-size:13px}
.pchip.on{background:var(--ink);color:var(--bg)}
.pchip.on .av{background:var(--accent);color:var(--accent-ink)}
.pchip.add{padding:5px 14px;color:var(--muted);font-weight:600;background:transparent;box-shadow:none;border:1.5px dashed var(--line)}
.addform{display:flex;flex-direction:column;gap:10px}
.addrow{display:flex;gap:10px;flex-wrap:wrap}
.addrow label{flex:1;min-width:130px;display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.addrow input{height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink);font:600 16px var(--body);padding:0 10px}
.addrow button{height:40px;padding:0 18px;border-radius:10px;font-weight:700;background:var(--surface2)}
.addrow button.primary{background:var(--accent);color:var(--accent-ink)}
.views{width:100%}
.views button{flex:1;padding:9px 4px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px}
.stat small{display:block;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--display);font-size:32px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.wkdots{display:flex;gap:6px;margin-top:10px}
.wkdots div{flex:1;text-align:center;font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:4px;align-items:center}
.wkdots i{width:100%;height:8px;border-radius:4px;background:var(--line)}
.wkdots i.part{background:var(--accent)}
.wkdots i.skip{background:repeating-linear-gradient(45deg,var(--line) 0 3px,transparent 3px 6px)}
.wkdots i.full{background:var(--done)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:right;padding:0 0 8px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:9px 0;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.tbl td:first-child{font-weight:600;padding-right:8px}
.up{color:var(--done);font-weight:700}
.flat{color:var(--muted)}
.bigchart svg{display:block;width:100%;height:120px}
.bigchart .axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
[hidden]{display:none!important}
.tbl th+th,.tbl td+td{padding-left:12px}
.empty{color:var(--muted);font-size:14px;margin:0}
.weeknav{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);white-space:nowrap}
.weeknav button{width:34px;height:34px;border-radius:10px;background:var(--surface);box-shadow:var(--shadow);font-size:18px;line-height:1}

.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--surface);border-radius:12px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:var(--shadow);position:relative}
.day b{font-family:var(--display);font-size:22px;line-height:1}
.day small{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.day i{font-style:normal;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.day.on{background:var(--ink);color:var(--bg)}
.day.on small,.day.on i{color:inherit;opacity:.75}
.day .dot{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--done)}
.day.today:not(.on){outline:2px solid var(--accent);outline-offset:-2px}

.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hero h1{font-family:var(--display);font-weight:800;font-size:44px;line-height:.9;margin:0;text-transform:uppercase;text-wrap:balance}
.hero p{margin:4px 0 0;color:var(--muted);font-size:14px}
.ring{flex:none;text-align:right}
.ring strong{font-family:var(--display);font-size:28px;line-height:1}
.ring span{display:block;font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar > div{height:100%;background:var(--done);transition:width .3s}

.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px}
.cardio{display:flex;flex-direction:column;gap:2px;padding:6px 14px}
.check{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%;text-align:left}
.cardio > * + *{border-top:1px solid var(--line)}
.cblock{padding-bottom:12px}
.cpick{display:flex;gap:10px;flex-direction:column}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;border:1.5px solid var(--line)}
.seg button{padding:7px 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.step{display:flex;align-items:center;gap:4px;background:var(--surface2);border-radius:10px;padding:3px;border:1.5px solid var(--line)}
.step button{width:34px;height:32px;border-radius:8px;font-size:20px;font-weight:700;background:var(--surface)}
.step span{min-width:62px;text-align:center;font-size:14px;color:var(--muted)}
.step span b{color:var(--ink);font-size:16px}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:15px;font-weight:700;color:transparent}
.check.done .box{background:var(--done);border-color:var(--done);color:#fff}
.check .t{flex:1}
.check .t b{display:block;font-weight:600}
.check .t small{color:var(--muted);font-size:13px}
.label{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:6px 2px -4px}

.ex{display:flex;flex-direction:column;gap:10px}
.ex.complete{background:linear-gradient(var(--done-soft),var(--done-soft)) , var(--surface)}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exhead h3{margin:0;font-size:18px;font-weight:700;line-height:1.2}
.exhead .meta{font-size:13px;color:var(--muted);margin-top:2px}
.exhead .meta em{font-style:normal;color:var(--ink);font-weight:600}
.chips{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.kchip{font-size:12px;font-weight:700;color:var(--accent);padding-right:4px}
.ring .kcl{color:var(--accent);font-weight:700}
.restchip{flex:none;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;align-items:center}
.set .n{font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted);text-align:center}
.field{position:relative}
.field input{width:100%;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink);font:600 18px/1 var(--body);font-variant-numeric:tabular-nums;padding:0 40px 0 12px;-webkit-appearance:none;appearance:none}
.field input::placeholder{color:var(--muted);opacity:.6}
.field input:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.field span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.tick{height:46px;border-radius:12px;background:var(--surface2);border:1.5px solid var(--line);font-size:20px;font-weight:700;color:var(--muted)}
.set.done .tick{background:var(--done);border-color:var(--done);color:#fff}
.set.done input{border-color:transparent;background:var(--done-soft)}
.addset{align-self:flex-start;font-size:13px;font-weight:600;color:var(--muted);padding:4px 2px}

.rest-day{text-align:center;padding:26px 18px;display:flex;flex-direction:column;gap:8px;align-items:center}
.rest-day h2{font-family:var(--display);font-size:32px;margin:0;text-transform:uppercase}
.rest-day p{margin:0;color:var(--muted);max-width:34ch}

.bw{display:flex;align-items:center;gap:14px}
.bw .field{width:120px;flex:none}
.bw .info{flex:1;min-width:0}
.bw .info b{font-family:var(--display);font-size:22px}
.bw .info small{display:block;color:var(--muted);font-size:13px}
.bw svg{display:block;width:100%;height:34px}

.note{font-size:12px;color:var(--muted);text-align:center;padding:4px 10px}

.timer{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);transform:translateY(110%);transition:transform .25s ease;z-index:10}
.timer.show{transform:none}
.ex .timer{position:static;transform:none;border-radius:14px;padding:12px;overflow:hidden;z-index:auto}
.ex .timer .in{grid-template-columns:auto 1fr auto auto auto;gap:6px}
.ex .timer .clock{font-size:38px}
 .mline{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:12px;font-weight:600;color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.sw.p{background:var(--accent)}.sw.s{background:var(--warm)}
.muscles{display:flex;flex-direction:column;gap:12px;align-items:stretch;background:var(--surface);border-radius:10px;padding:12px}
.mfigs{display:flex;gap:24px;justify-content:center}
.mfigs figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.mfigs figcaption{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.mmap{width:110px;max-width:38vw;height:auto;display:block}
.mmap .sil{fill:var(--surface2);stroke:var(--line);stroke-width:1}
.mmap .sil .limb line{stroke:var(--surface2)}
.mmap .m{fill:var(--mbase);stroke:var(--surface);stroke-width:1}
.mmap .sil .limb line{stroke-linecap:round}
.mmap .m-p{fill:var(--accent);animation:mpulse 1.6s ease-in-out infinite}
.mmap .m-s{fill:var(--warm)}
.mmap .lines{fill:none;stroke:var(--surface);stroke-width:.9}
@keyframes mpulse{50%{opacity:.6}}
@media (prefers-reduced-motion: reduce){.mmap .m-p{animation:none}}
.mlegend{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:14px;line-height:1.3;min-width:0}
.mlegend div{display:flex;gap:8px;align-items:flex-start}
.mlegend .sw{margin-top:3px}
.howbtn{margin-top:6px;font-size:13px;font-weight:700;color:var(--accent);padding:2px 0}
.how{display:flex;flex-direction:column;gap:10px;background:var(--surface2);border-radius:12px;padding:10px}
.stage{position:relative;background:var(--surface);border-radius:10px;overflow:hidden}
.how canvas{width:100%;height:auto;aspect-ratio:240/170;display:block}
.eqlabel,.drag{position:absolute;bottom:8px;font-size:12px;font-weight:700;color:var(--muted);pointer-events:none}
.eqlabel{left:10px}.drag{right:10px;top:8px;bottom:auto;font-weight:600;font-size:11px}
.howtxt ul{margin:0;padding-left:18px;font-size:15px;line-height:1.35;display:flex;flex-direction:column;gap:4px}
.howtxt a{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--accent)}
.recban{border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.35}
.recban.ok{background:var(--done-soft);color:var(--ink)}
.recban.ok b{color:var(--done)}
.recban.warn{background:var(--accent-soft);color:var(--ink)}
.recban.warn b{color:var(--accent)}
.mmap .m-ok{fill:var(--done)}
.mmap .m-rec{fill:var(--warm)}
.mmap .m-idle{fill:var(--mbase)}
.sw.ok{background:var(--done)}.sw.idle{background:var(--mbase)}
.rleg{grid-template-columns:repeat(3,auto);justify-content:center;margin-top:10px;font-size:13px}
.reclist{margin:10px 0 0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:3px}
.moves .mvrow{display:flex;align-items:center;gap:8px}
.moves .mvrow + .mvrow{border-top:1px solid var(--line)}
.moves > * + *{border-top:none}
.moves .check{flex:1}
.mvtip{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.3}
.mvlink{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--accent);font-size:12px;text-decoration:none}
.moves .addset{margin:6px 0 8px}
.wprog{display:flex;flex-direction:column;gap:12px}
.wstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wstats div{background:var(--surface2);border-radius:10px;padding:8px}
.wstats small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wstats b{font-family:var(--display);font-size:24px;line-height:1.1}
.wstats b.good{color:var(--done)}
.wstats span{font-size:12px;color:var(--muted);margin-left:2px}
.goalin{display:flex;align-items:baseline;gap:2px}
.goalin input{width:100%;min-width:0;border:0;border-bottom:1.5px dashed var(--line);background:transparent;color:var(--ink);font:700 22px/1.2 var(--display);padding:0}
.goalin input:focus{outline:none;border-bottom-color:var(--accent)}
.gbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.gbar div{height:100%;background:var(--done);border-radius:5px}
.gcap{font-size:13px;color:var(--muted);margin-top:-6px}
.pace{margin:0;font-size:14px;line-height:1.4}
.wchart{position:relative}
.wchart svg{display:block;width:100%;height:auto}
.wchart .grid{stroke:var(--line);stroke-width:1}
.wchart .tick{fill:var(--muted);font-size:10px;font-family:var(--body)}
.wchart .goal{stroke:var(--done);stroke-width:1.5;stroke-dasharray:4 4}
.wchart .goalt{fill:var(--done);font-weight:700}
.wchart .area{fill:var(--accent-soft);opacity:.7}
.wchart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.wchart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.wchart .dot.end{r:5}
.wchart .hit{fill:transparent;cursor:pointer}
.wtip{position:absolute;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:8px;white-space:nowrap;pointer-events:none}
.tbl td.bad{color:var(--accent);font-weight:700}
.tbl small{color:var(--muted)}
@media (max-width:480px){.wstats{grid-template-columns:repeat(2,1fr)}}
.weighin{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--done)}
.kg{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:1px}
.kgi{font-size:13px;color:var(--muted);font-weight:600}
.bmi{display:flex;flex-direction:column;gap:10px}
.bmirow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bmival{display:flex;align-items:center;gap:10px}
.bmival b{font-family:var(--display);font-size:44px;line-height:1}
.bcat{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px}
.bcat.ok{background:var(--done-soft);color:var(--done)}
.bcat.over{background:color-mix(in srgb,var(--warm) 22%,transparent);color:var(--ink)}

.omadpick{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:600}
.omadpick button{padding:6px 11px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface2);font-weight:700;font-size:13px;color:var(--ink)}
.omadpick button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.skippedm{padding:10px 14px;opacity:.85}
.sug{margin-top:4px;font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.3}
.sug.up{color:var(--done)}
.field input.pre{color:var(--ink);font-weight:500}
.wadj{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted)}
.wadj span{flex:1}
.wadj button{padding:6px 12px;border-radius:999px;background:var(--surface2);border:1.5px solid var(--line);font-weight:700;font-size:13px;color:var(--ink)}
.setbtns{display:flex;gap:16px}
.timer .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto auto auto;align-items:center;gap:8px}
.timer .clock{font-family:var(--display);font-weight:800;font-size:46px;line-height:1;min-width:3.2ch;grid-column:1/3}
.timer .what{grid-column:1/-1;grid-row:2;min-width:0;font-size:13px;opacity:.85;display:flex;gap:6px}
.timer .what b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer button{height:44px;padding:0 12px;border-radius:12px;background:rgba(127,127,127,.22);font-weight:700;font-size:14px}
.timer button.go{background:var(--accent);color:var(--accent-ink)}
.timer .prog{position:absolute;left:0;top:0;height:4px;background:var(--accent);transition:width .25s linear}
.timer.over{background:var(--accent);color:var(--accent-ink)}
.timer.over .prog{background:var(--accent-ink)}
@media (prefers-reduced-motion: reduce){.timer,.bar>div,.timer .prog{transition:none}}
.focus{display:inline-block;margin-top:5px;font-size:12px;font-weight:700;color:var(--accent,#c0392b);background:color-mix(in srgb,currentColor 10%,transparent);padding:2px 8px;border-radius:999px}
.planrow{justify-content:space-between;gap:8px;flex-wrap:wrap}.planrow .seg button{font-size:12.5px;padding:6px 9px}
.timer button.iphone{grid-column:1/-1;height:34px;font-size:12.5px;font-weight:600;background:rgba(127,127,127,.16)}
.ptoast{position:fixed;left:16px;right:16px;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.card.iph ol{margin:8px 0 0 18px;padding:0;font-size:14px;line-height:1.5}.card.iph li{margin:4px 0}
</style>

let dl=null,bkList=null,bkBusy=false,bkMsg="",confirmId=null;
const bkId=(p,d)=>p+"__"+d;
function snapshotBody(){

async function writeBackup(id,body){
  if(db){await db.doc("backups/"+id).set(body)}
  else{try{const all=JSON.parse(localStorage.getItem("platelog.backups")||"{}");all[id]=body;localStorage.setItem("platelog.backups",JSON.stringify(all))}catch(e){}}
}
async function listBackups(){
  let arr=[];
  if(db){try{const q=await db.collection("backups").where("pid","==",pid).get();arr=q.docs.map(d=>Object.assign({id:d.id},d.data()))}catch(e){arr=[]}}
  else{try{const all=JSON.parse(localStorage.getItem("platelog.backups")||"{}");arr=Object.keys(all).filter(k=>all[k].pid===pid).map(k=>Object.assign({id:k},all[k]))}catch(e){}}
  return arr.sort((a,b)=>b.at<a.at?-1:1);
}
let lastBkAt=0;
async function dailyBackup(force){ // one backup per person per day, refreshed when you leave the app
  if(!Object.keys(logs).length)return;
  const now=Date.now();if(!force&&now-lastBkAt<10*60*1000)return;lastBkAt=now;
  try{
    await writeBackup(bkId(pid,key(new Date())),snapshotBody());
    const all=await listBackups();const daily=all.filter(b=>!/__pre-/.test(b.id));
    const old=daily.slice(21).concat(all.filter(b=>/__pre-/.test(b.id)).slice(5));
    for(const b of old){if(db)await db.doc("backups/"+b.id).delete().catch(()=>{})}
    bkList=null;
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")dailyBackup(true)});
async function restoreBackup(b){
  bkBusy=true;bkMsg="Restoring…";render();
  try{
    await writeBackup(bkId(pid,"pre-"+new Date().toISOString().replace(/[:.]/g,"-")),snapshotBody());
    const target=b.logs||{};const col=colName();
    for(const d of Object.keys(logs))if(!target[d]){delete logs[d];if(db)await db.doc(col+"/"+d).delete().catch(()=>{})}
    for(const d of Object.keys(target)){logs[d]=JSON.parse(JSON.stringify(target[d]));if(db)await db.doc(col+"/"+d).set(logs[d])}

function restoreFromFile(file){

function backupCard(){

let healthMsg="";
function parseHealthText(txt){
  const out=[];const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  txt.split(/\r?\n/).forEach(line=>{
    const l=line.trim();if(!l)return;let d=null,rest=l;
    let mm=l.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);if(mm){d=new Date(+mm[1],+mm[2]-1,+mm[3]);rest=l.replace(mm[0]," ")}
    else if((mm=l.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))){const yy=+mm[3]<100?2000+ +mm[3]:+mm[3];d=new Date(yy,+mm[1]-1,+mm[2]);rest=l.replace(mm[0]," ")}
    else if((mm=l.match(/([A-Za-z]{3})[a-z]*\.? (\d{1,2}),? (\d{4})/))&&MON[mm[1].toLowerCase()]!==undefined){d=new Date(+mm[3],MON[mm[1].toLowerCase()],+mm[2]);rest=l.replace(mm[0]," ")}
    if(!d)return;
    rest=rest.replace(/\d{1,2}:\d{2}(:\d{2})?\s*(AM|PM)?/i," ");
    const w=rest.match(/(\d{2,3}(?:\.\d+)?)\s*(kg|lb|lbs|pounds|kilograms)?/i);if(!w)return;
    let v=+w[1];const u=(w[2]||"").toLowerCase();
    const lb=u.startsWith("k")?v*2.2046:u.startsWith("l")||u.startsWith("p")?v:(UL()==="kg"?v*2.2046:v);
    if(lb<60||lb>600)return;out.push({k:key(d),lb:+lb.toFixed(1)});
  });
  return out;
}

function healthCard(){
  const card=document.createElement("div");card.className="card health";
  card.innerHTML=`<div class="exhead"><div><h3>Apple Health</h3><div class="meta">Web apps can't open Apple Health directly. These two Shortcuts move data across in one tap.</div></div></div>
   <details><summary><b>① Import weights from Health</b></summary>
    <ol class="steps"><li>Open the <b>Shortcuts</b> app → <b>+</b> → name it <b>Plate Log Weights</b>.</li>
     <li>Add <b>Find Health Samples</b>: Type <b>Weight</b>, Start Date <b>is in the last 30 days</b>, sort <b>Start Date</b>, latest first.</li>
     <li>Add <b>Repeat with Each</b>, and inside it a <b>Text</b> action with <i>Start Date</i> (Format: ISO 8601, no time) then a space then <i>Repeat Item</i>.</li>
     <li>After the repeat, add <b>Combine Text</b> (New Lines) and <b>Copy to Clipboard</b>.</li>
     <li>Run the shortcut, come back here, and paste below.</li></ol>
    <textarea id="hPaste" rows="4" placeholder="Paste here, e.g.&#10;2026-09-28 87.4 kg&#10;2026-10-05 86.9 kg"></textarea>
    <button class="primary" id="hImport">Import weights</button></details>
   <details><summary><b>② Send today's workout to Health</b></summary>
    <ol class="steps"><li>In Shortcuts, make a shortcut <b>Plate Log Workout</b> with: <b>Get Clipboard</b> → <b>Split Text</b> by comma → <b>Log Workout</b> (Type <b>Traditional Strength Training</b>, Duration = item 1 minutes, Energy = item 2 kcal).</li>
     <li>After your workout, tap the button below, then run the shortcut.</li></ol>
    <button class="primary" id="hCopy">Copy today's workout for Health</button><p class="hout num" id="hOut"></p></details>
   ${healthMsg?`<p class="bkmsg">${healthMsg}</p>`:""}`;
  card.querySelector("#hImport").onclick=()=>{
    const items=parseHealthText(card.querySelector("#hPaste").value);
    if(!items.length){healthMsg="No weights found. Each line needs a date and a weight, like “2026-09-28 87.4 kg”.";render();return}
    let n=0;items.forEach(it=>{if(it.k<key(PROGRAM_START))return;const wi=(new Date(it.k+"T12:00").getDay()+6)%7;const L=getLog(it.k,planFor(it.k,wi).k,true);L.bw=String(it.lb);save(it.k);n++});
    healthMsg=`Imported ${n} weigh-in${n===1?"":"s"} from Apple Health.`+(items.length>n?` ${items.length-n} ${items.length-n===1?"was":"were"} from before your program start and ${items.length-n===1?"was":"were"} skipped.`:"");render();
  };
  card.querySelector("#hPaste").addEventListener("paste",()=>{});
  card.querySelector("#hCopy").onclick=async()=>{
    const t=key(new Date());const L=logs[t];const kc=Math.round(dayKcal(t));
    let mins=0;if(L){Object.keys(L.cset||{}).forEach(c=>{if(L.cardio&&L.cardio[c])mins+=num(L.cset[c].min)});Object.keys(L.ex||{}).forEach(e=>{const dn=(L.ex[e]||[]).filter(x=>x&&x.d).length;mins+=dn*(1+restFor(e)/60)});mins+=Object.values(L.mob||{}).filter(Boolean).length+Object.values(L.str||{}).filter(Boolean).length}
    mins=Math.round(mins);const text=`${mins},${kc}`;const out=card.querySelector("#hOut");
    if(!mins){out.textContent="Nothing logged today yet.";return}
    try{await navigator.clipboard.writeText(text);out.textContent=`Copied: ${mins} min, ${kc} kcal. Now run “Plate Log Workout” in Shortcuts.`}
    catch(e){out.textContent=`Copy this: ${text}  (${mins} min, ${kc} kcal)`}
  };
  return card;
}

function foodScore(f,toks){
  const hay=fnorm(f.n+" "+(f.a||"")+" "+f.cat);const words=hay.split(" ");const nw=fnorm(f.n).split(" ");let sc=0;
  toks.forEach(t=>{if(nw.some(w=>w.startsWith(t)))sc+=2});
  for(const t of toks){
    if(words.some(w=>w===t)){sc+=4;continue}
    if(words.some(w=>w.startsWith(t))){sc+=3;continue}
    if(hay.includes(t)){sc+=2;continue}
    const tol=t.length>=8?2:t.length>=4?1:0;
    if(tol&&words.some(w=>lev(w,t)<=tol||(w.length>t.length&&lev(w.slice(0,t.length),t)<=1))){sc+=1;continue}

}

function quickFor(u){return u==="g"?[50,100,150,200,250,300]:u==="ml"?[100,200,250,330,500]:u==="oz"?[2,4,6,8]:u==="floz"?[8,12,16,20]:u==="cup"||u==="bowl"?[0.5,1,1.5,2]:[0.5,1,1.5,2,3]}
function nutHtml(f,q,u){const sv=servingsOf(f,q,u);const g=gOf(f);
  return `<div class="shk"><b class="num">${Math.round(f.k*sv)}</b><span>kcal</span></div>
   <div class="shm num"><div><b>${Math.round(f.p*sv)}</b><small>Protein g</small></div><div><b>${Math.round(f.c*sv)}</b><small>Carbs g</small></div><div><b>${+((f.fi||0)*sv).toFixed(1)}</b><small>Fibre g</small></div><div><b>${Math.round(f.f*sv)}</b><small>Fat g</small></div></div>
   ${g&&(!u||u==="s")?`<p class="shw">≈ ${Math.round(g*num(q))} ${isLiq(f)?"ml":"g"}</p>`:""}`}
function sheetHtml(){
  const f=foodById(sheet.id);if(!f)return"";const edit=sheet.mode==="edit";const mealName=(MEALS.find(x=>x[0]===sheet.meal)||[])[1]||"";
  return `<div class="fsheet" id="fsheet">
   <div class="fsh-head"><div><b>${f.n}</b><small>${f.u}${gOf(f)&&!/\d\s*(g|ml)\b/.test(f.u)?` (${gOf(f)} ${isLiq(f)?"ml":"g"})`:""} · ${f.k} kcal per serving</small></div><span class="fsh-tag">${edit?"Editing":"New"}</span></div>
   <div class="fsh-amt"><button data-sq="-1" aria-label="Less">−</button><input id="shQ" class="num" inputmode="decimal" value="${sheet.q}" aria-label="Amount"><button data-sq="1" aria-label="More">+</button>
    <select id="shU" aria-label="Unit">${unitsFor(f).map(([k,l])=>`<option value="${k}" ${sheet.u===k?"selected":""}>${l}</option>`).join("")}</select></div>

   <div class="fsh-nut" id="shNut">${nutHtml(f,sheet.q,sheet.u)}</div>

  </div>`;
}
function wireSheet(root){
  const el=root.querySelector("#fsheet");if(!el)return;const f=foodById(sheet.id);
  const qIn=el.querySelector("#shQ"),nut=el.querySelector("#shNut");
  const refresh=()=>{nut.innerHTML=nutHtml(f,sheet.q,sheet.u);el.querySelectorAll("[data-qv]").forEach(b=>b.classList.toggle("on",num(sheet.q)===num(b.dataset.qv)))};
  qIn.addEventListener("input",()=>{const v=num(qIn.value);if(v>0){sheet.q=v;refresh()}});
  el.querySelectorAll("[data-sq]").forEach(b=>b.onclick=()=>{const st=stepFor(sheet.u);sheet.q=Math.max(st,+(Math.round((num(sheet.q)+ +b.dataset.sq*st)/st)*st).toFixed(2));qIn.value=sheet.q;refresh()});
  el.querySelectorAll("[data-qv]").forEach(b=>b.onclick=()=>{sheet.q=num(b.dataset.qv);qIn.value=sheet.q;refresh()});
  el.querySelector("#shU").addEventListener("change",ev=>{const nu=ev.target.value;const sv=servingsOf(f,sheet.q,sheet.u);let q=nu==="s"?sv:sv*gOf(f)/unitSize(f,nu);const st=stepFor(nu);sheet.q=+Math.max(st,Math.round(q/st)*st).toFixed(2);sheet.u=nu;render();document.getElementById("fsheet")?.scrollIntoView({block:"nearest"})});
  el.querySelector("#shMeal").addEventListener("change",ev=>{sheet.meal=ev.target.value;el.querySelector("#shOk").textContent=sheet.mode==="edit"?"Save changes":"Add to "+MEALS.find(x=>x[0]===sheet.meal)[1]});
  el.querySelector("#shCancel").onclick=()=>{sheet=null;render()};
  const del=el.querySelector("#shDel");if(del)del.onclick=()=>{if(!sheet.delAsk){sheet.delAsk=true;del.textContent="Tap again to remove";return}
    const L=foodLog(true);const arr=L.food&&L.food[sheet.fromMeal];if(arr){arr.splice(sheet.idx,1);if(!arr.length)delete L.food[sheet.fromMeal]}save(foodDate);
    foodToast={meal:sheet.fromMeal,text:`Removed ${f.n}`,t:Date.now()};sheet=null;render()};
  el.querySelector("#shOk").onclick=()=>{
    const v=num(qIn.value);if(!(v>0)){qIn.focus();return}sheet.q=v;
    const L=foodLog(true);L.food=L.food||{};const today=foodDate===key(new Date());
    const entry=[sheet.id,+num(sheet.q).toFixed(2),today?Date.now():0];if(sheet.u&&sheet.u!=="s")entry.push(sheet.u);
    if(sheet.mode==="edit"){const src=L.food[sheet.fromMeal]||[];const old=src[sheet.idx];if(old&&old[2])entry[2]=old[2];src.splice(sheet.idx,1);if(!src.length)delete L.food[sheet.fromMeal]}
    else if(today)noteMealTime();
    (L.food[sheet.meal]=L.food[sheet.meal]||[]).push(entry);save(foodDate);
    const mn=MEALS.find(x=>x[0]===sheet.meal)[1];
    foodToast={meal:sheet.meal,text:`✓ ${sheet.mode==="edit"?"Saved":"Added"} ${f.n} · ${qtyLabel(f,entry[1],entry[3])} · ${Math.round(f.k*servingsOf(f,entry[1],entry[3]))} kcal${sheet.mode==="edit"&&sheet.fromMeal!==sheet.meal?" (moved to "+mn+")":sheet.mode==="edit"?"":" to "+mn}`,t:Date.now()};
    sheet=null;render();
  };
  setTimeout(()=>el.scrollIntoView({block:"nearest",behavior:"smooth"}),30);
}

function noteMealTime(){ // first food after a fast: record the fast and open the eating window
  if(foodDate!==key(new Date())||!fastGoal())return;const S=fastState();
  if(S&&S.mode==="fast"&&S.elapsed>=12*3600e3){const L=getLog(key(new Date()),planFor(key(new Date()),(new Date().getDay()+6)%7).k,true);L.fastDone=+(S.elapsed/3600e3).toFixed(1);settings.winStart=Date.now();delete settings.fastStart;saveSettingsClean()}
}

// ---------- food + fasting totals shared by Summary and Calendar ----------
function weekFood(ws){
  const days=[];let eaten=0,prot=0,logged=0,onT=0,fasts=0,fastH=0,bal=0,balDays=0;
  for(let i=0;i<7;i++){const k=key(addDays(ws,i));const D=dayFood(k);const T=foodTarget(k);const L=logs[k];const fh=num(L&&L.fastDone);
    const has=D.tot.k>0;const tdee=T.bmr*T.act+dayKcal(k);
    if(has){logged++;eaten+=D.tot.k;prot+=D.tot.p;if(D.tot.k<=T.budget+100&&D.tot.k>=T.budget*0.6)onT++;if(D.tot.k>=T.budget*0.6){bal+=D.tot.k-tdee;balDays++}}
    if(fh){fastH+=fh;if(fh>=12)fasts++}
    days.push({k,eaten:D.tot.k,budget:T.budget,fast:fh});}
  return {days,logged,avgK:logged?Math.round(eaten/logged):0,avgP:logged?Math.round(prot/logged):0,onT,fasts,avgFast:fasts?+(fastH/fasts).toFixed(1):0,bal:Math.round(bal),balDays};
}
function nutritionCard(ws,wn){

  const bars=W.days.map(d=>{const h=d.eaten/mx*100,b=d.budget/mx*100;const over=d.eaten>d.budget+100;
    return `<div class="nb" title="${d.k}: ${Math.round(d.eaten)} of ${d.budget} kcal"><div class="nbw"><i class="bud" style="bottom:${b}%"></i><i class="eat ${over?"over":""}" style="height:${h}%"></i></div>${d.fast?`<span class="fdot" title="${d.fast} h fast"></span>`:`<span class="fdot none"></span>`}<small>${new Date(d.k+"T12:00").toLocaleDateString(undefined,{weekday:"narrow"})}</small></div>`}).join("");
  const kgLoss=W.balDays?(-W.bal/7700):0;
  c.innerHTML=`<div class="exhead"><div><h3>Food & fasting · Week ${wn}</h3><div class="meta">From your Food tab logs</div></div></div>
   ${W.logged?`<div class="stats">

     <div class="stat"><small>Avg protein</small><b class="num">${W.avgP}</b><span> g/day</span></div>
     <div class="stat"><small>On target</small><b class="num">${W.onT}/${W.logged}</b><span> days</span></div>
     <div class="stat"><small>Fasts done</small><b class="num">${W.fasts}/7</b><span>${W.fasts?` · avg ${W.avgFast} h`:""}</span></div>
   </div>

   <div class="clegend"><span><i class="lg eatlg"></i>Eaten</span><span><i class="lg budlg"></i>Budget</span><span><i class="fdot"></i>Fast completed</span></div>
   ${W.balDays?`<p class="pace">Estimated energy balance on ${W.balDays} fully logged day${W.balDays===1?"":"s"}: <b>${W.bal<=0?"−":"+"}${Math.abs(W.bal).toLocaleString()} kcal</b> ≈ <b>${kgLoss>=0?"":"+"}${Math.abs(kgLoss).toFixed(2)} kg</b> of body fat ${kgLoss>=0?"lost":"gained"}. Compare it with your weekly weigh-in above.</p>`:""}`
   :`<p class="empty">Log meals in the Food tab to see your intake, protein and fasting here.</p>${W.fasts?`<p class="pace">Fasts done this week: <b>${W.fasts}</b>, average ${W.avgFast} h.</p>`:""}`}`;
  return c;

function bodyWeightCard(k){
  const card=document.createElement("div");card.className="card bw";
  const L=logs[k];
  const pts=Object.keys(logs).filter(d=>logs[d]&&logs[d].bw).sort().map(d=>({d,v:parseFloat(logs[d].bw)})).filter(x=>!isNaN(x.v));
  const START=startW();
  const latest=pts.length?pts[pts.length-1].v:START;
  const diff=+(latest-START).toFixed(1);
  let svg="";
  const series=[{v:START},...pts].slice(-20);
  if(series.length>=2){
    const vs=series.map(x=>x.v);const min=Math.min(...vs)-.3,max=Math.max(...vs)+.3;
    const W=200,H=34;const xy=series.map((x,i)=>[(i/(series.length-1))*(W-6)+3,H-3-((x.v-min)/(max-min))*(H-6)]);
    svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" points="${xy.map(p=>p.join(",")).join(" ")}"/><circle cx="${xy[xy.length-1][0]}" cy="${xy[xy.length-1][1]}" r="3" fill="var(--accent)"/></svg>`;
  }
  card.innerHTML=`<div class="field"><input id="bw-${k}" inputmode="decimal" placeholder="${dvn(latest)}" value="${L&&L.bw?dvn(L.bw):""}" aria-label="Body weight today in ${UL()}"><span>${UL()}</span></div>
    <div class="info">${dayIdx===0?`<span class="weighin">Weekly weigh-in day · before breakfast</span>`:""}<b class="num">${fw(latest)}</b> <span class="kgi num">${alt(latest)}${bmiOf(latest)?" · BMI "+bmiOf(latest):""}</span><small class="num">${diff<=0?"▼ ":"▲ "}${fw(Math.abs(diff))} (${alt(Math.abs(diff))}) since start</small>${svg}</div>`;
  card.querySelector("input").addEventListener("change",ev=>{
    const v=ev.target.value.trim();const L=getLog(k,PLAN[dayIdx].k,true);
    if(v)L.bw=String(fromU(v));else delete L.bw;save(k);render();
  });
  return card;
}

const FASTM=["abs","obliques","forearms","calves"];

function dayDiff(a,b){return Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/864e5)}
function recoveryAt(dateKey){ // status of each muscle on dateKey, from sets logged on earlier days
  const out={};
  Object.keys(logs).filter(d=>d<dateKey).sort().forEach(d=>{
    const L=logs[d];if(!L||!L.ex)return;
    Object.keys(L.ex).forEach(e=>{
      if(!(L.ex[e]||[]).some(x=>x&&x.d)||!MUSCLES[e])return;
      [["p",MUSCLES[e].p],["s",MUSCLES[e].s]].forEach(([role,list])=>list.forEach(m=>{
        const ready=recHours(m,role);const gap=dayDiff(d,dateKey)*24;
        const prev=out[m];const left=Math.max(0,ready-gap);
        if(!prev||left>prev.left||(left===prev.left&&d>prev.date))out[m]={date:d,role,left,ex:e};
      }));
    });
  });
  return out;
}

  const tired=[...need].filter(m=>R[m]&&R[m].left>0);
  if(!tired.length)return `<div class="recban ok"><b>✓ Recovered</b> All main muscles for today have had their rest. Go for it.</div>`;
  return `<div class="recban warn"><b>⚠ Still recovering:</b> ${tired.map(m=>`${MNAME[m]} (worked ${dayDiff(R[m].date,dateKey)===1?"yesterday":dayDiff(R[m].date,dateKey)+" days ago"})`).join(", ")}. Go lighter on these, or rest and do this workout tomorrow.</div>`;

const live3D=new Set();
function mountAnim3D(cv,k){
  const o=make3D(cv,k);

let anim3On=false;
function loop3D(t){

// ---------- rest timer ----------
let tEnd=0,tTotal=0,tInt=null,audio=null,beeped=false,wake=null;
// ---- iPhone lock-screen timer via the Shortcuts app (Clock timer shows as a Live Activity) ----
const IPH_SHORTCUT="Plate Log Timer";
function phoneToast(msg){let t=document.getElementById("ptoast");if(!t){t=document.createElement("div");t.id="ptoast";t.className="ptoast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=msg;clearTimeout(phoneToast._t);phoneToast._t=setTimeout(()=>t.remove(),6000)}
function phoneTimer(sec,what){
  sec=Math.max(1,Math.min(86399,Math.round(sec)));
  try{navigator.clipboard&&navigator.clipboard.writeText(String(sec)).catch(()=>{})}catch(e){}
  const url="shortcuts://run-shortcut?name="+encodeURIComponent(IPH_SHORTCUT)+"&input=text&text="+sec;
  try{const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove()}catch(e){}
  const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s2=sec%60;
  phoneToast(`Sending ${h?h+" h ":""}${m?m+" min ":""}${!h&&s2?s2+" sec ":""}${what} to your iPhone Clock. If Shortcuts doesn't open, run "${IPH_SHORTCUT}" yourself — the time is already copied. First time? See "iPhone lock-screen timers" in Summary.`);
}
function beep(){
  try{
    if(!audio)return;
    [0,.25,.5].forEach(t=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=880;o.connect(g);g.connect(audio.destination);const s=audio.currentTime+t;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.3,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.18);o.start(s);o.stop(s+.2)});
  }catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
}
let tEx=null,tActive=false;const timerEl=document.getElementById("timer");
function startRest(sec,next,exId){tEx=exId||null;tActive=true;
  try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume&&audio.resume()}catch(e){}
  try{if(navigator.wakeLock&&!wake)navigator.wakeLock.request("screen").then(w=>{wake=w;w.addEventListener("release",()=>wake=null)}).catch(()=>{})}catch(e){}
  tTotal=sec;tEnd=Date.now()+sec*1000;beeped=false;
  $("#tnext").textContent=next||"";
  $("#timer").classList.add("show");$("#timer").classList.remove("over");
  clearInterval(tInt);tInt=setInterval(tick,250);tick();
}
function tick(){
  if(!timerEl.isConnected){document.body.appendChild(timerEl);tEx=null}
  const left=(tEnd-Date.now())/1000;
  const el=$("#timer");
  if(left<=0){
    $("#tclock").textContent="Go!";$("#tlabel").textContent="Rest over";$("#tprog").style.width="100%";
    el.classList.add("over");
    if(!beeped){beeped=true;beep()}
    if(left<-20)stopRest();
    return;
  }
  $("#tlabel").textContent="Rest";
  $("#tclock").textContent=fmtTime(left);
  $("#tprog").style.width=((1-left/tTotal)*100)+"%";
}
function stopRest(){tActive=false;tEx=null;clearInterval(tInt);document.body.appendChild(timerEl);$("#timer").classList.remove("show","over");try{wake&&wake.release()}catch(e){}}
$("#tplus").onclick=()=>{tEnd=Math.max(tEnd,Date.now())+15000;tTotal+=15;beeped=false;$("#timer").classList.remove("over");tick()};
$("#tminus").onclick=()=>{tEnd-=15000;tick()};
$("#tskip").onclick=stopRest;
$("#tphone").onclick=()=>{const left=(tEnd-Date.now())/1000;if(left>1)phoneTimer(left,"rest")};

$("#vLog").onclick=()=>setView("log");$("#vFood").onclick=()=>setView("food");$("#vCal").onclick=()=>setView("cal");$("#vSum").onclick=()=>setView("sum");

// ---------- profiles ----------
let unsub=null;const bkDone={};
function renderProfiles(){
  const row=$("#profiles");row.innerHTML="";
  profiles.forEach(pr=>{
    const b=document.createElement("button");b.className="pchip"+(pr.id===pid?" on":"");
    b.innerHTML=`<span class="av">${(pr.name||"?").trim().charAt(0).toUpperCase()}</span><span class="nm"></span>`;
    b.querySelector(".nm").textContent=pr.name;
    b.setAttribute("aria-pressed",pr.id===pid);
    b.onclick=()=>switchProfile(pr.id);
    row.appendChild(b);
  });
  const ur=$("#units");ur.innerHTML="";
  [["Body weight","bunit",UL()],["Lifting","lunit",LU()]].forEach(([lab,f,cur])=>{
    const g=document.createElement("div");g.className="ugrp";g.innerHTML=`<span>${lab}</span><div class="seg unit" role="group" aria-label="${lab} unit">${["kg","lb"].map(u=>`<button class="${cur===u?"on":""}" data-u="${u}">${u}</button>`).join("")}</div>`;
    g.querySelectorAll("button").forEach(b=>b.onclick=()=>{const pr=prof();pr[f]=b.dataset.u;delete pr.unit;saveProfiles();renderProfiles();render()});
    ur.appendChild(g);
  });
  const add=document.createElement("button");add.className="pchip add";add.textContent="+ Add";add.setAttribute("aria-label","Add a person");
  add.onclick=()=>{$("#addForm").hidden=!$("#addForm").hidden;if(!$("#addForm").hidden)$("#pName").focus()};
  row.appendChild(add);
}
function switchProfile(id){
  if(id===pid)return;
  flushAll();
  pid=id;settingsTouched=false;bkList=null;bkMsg="";confirmId=null;pendingFile=null;try{localStorage.setItem("platelog.profile",id)}catch(e){}
  Object.keys(logs).forEach(k=>delete logs[k]);settings={rest:{}};
  lsLoad();stopRest();renderProfiles();render();
  if(db)connectProfile();
}
function connectProfile(){
  if(unsub){try{unsub()}catch(e){}unsub=null}
  const myPid=pid,col=colName();
  db.doc(setPath()).get().then(sn=>{if(pid!==myPid)return;if(sn.exists){settings=Object.assign({rest:{}},sn.data(),settingsTouched?settings:{});lsSave();safeRender()}}).catch(()=>{});
  unsub=db.collection(col).onSnapshot(snap=>{
    if(pid!==myPid)return;
    let changed=false;
    snap.docs.forEach(doc=>{
      const path=col+"/"+doc.id;
      if(queue[path]||writing[path])return;
      const body=JSON.parse(JSON.stringify(doc.data()));
      if(JSON.stringify(logs[doc.id])!==JSON.stringify(body)){logs[doc.id]=body;changed=true}
    });
    Object.keys(logs).forEach(k=>{if(!snap.docs.some(x=>x.id===k))save(k)});
    if(changed){lsSave();safeRender()}
    if(!bkDone[myPid]){bkDone[myPid]=true;setTimeout(()=>dailyBackup(true),1500)}
  },()=>{$("#storeNote").textContent="Sync paused. Saving on this device."});
}
$("#addForm").addEventListener("submit",ev=>{
  ev.preventDefault();
  const name=$("#pName").value.trim();const st=num($("#pStart").value);const ht=num($("#pHeight").value);
  if(!name){$("#pName").focus();return}
  let id=name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"p";
  if(id==="list")id="list-2";
  while(profiles.some(x=>x.id===id))id+="-2";
  const un=$("#pUnit").value;profiles.push({id,name,start:st?(un==="kg"?+(st*2.2046).toFixed(1):st):150,height:ht||undefined,bunit:un,lunit:"lb"});$("#pHeight").value="";
  $("#pName").value="";$("#pStart").value="";$("#addForm").hidden=true;
  saveProfiles(profiles.find(x=>x.id===id));switchProfile(id);
});

// ---- Firebase: sign-in + cloud sync ----
dl={save:async({filename,data})=>{const blob=new Blob([data],{type:filename.endsWith(".json")?"application/json":"text/plain"});
  const file=new File([blob],filename,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:filename});return {status:"saved"}}catch(e){if(e&&e.name==="AbortError")throw {code:"declined"};}}
  const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return {status:"saved"}}};
let fbAuth=null,fbStarted=false,appMeta=null;
(function(){
  const gate=$("#authGate"),err=$("#auErr");
  if(!window.firebase||!window.FIREBASE_CONFIG){$("#storeNote").textContent="Saving on this device (cloud not set up).";return}
  firebase.initializeApp(window.FIREBASE_CONFIG);fbAuth=firebase.auth();
  const fs=firebase.firestore();try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  $("#authForm").addEventListener("submit",async ev=>{ev.preventDefault();err.textContent="";$("#auGo").disabled=true;
    try{await fbAuth.signInWithEmailAndPassword($("#auEmail").value.trim(),$("#auPass").value)}
    catch(e){err.textContent=/wrong-password|invalid-credential|user-not-found|invalid-login/.test(e.code||"")?"Email or password is not right.":(e.message||"Couldn't sign in.")}
    $("#auGo").disabled=false});
  $("#auForgot").onclick=async()=>{const em=$("#auEmail").value.trim();if(!em){err.textContent="Type your email first.";return}
    try{await fbAuth.sendPasswordResetEmail(em);err.textContent="Reset link sent. Check your email."}catch(e){err.textContent=e.message||"Couldn't send the link."}};
  fbAuth.onAuthStateChanged(user=>{
    if(!user){gate.hidden=false;return}
    gate.hidden=true;if(fbStarted)return;fbStarted=true;startSync(fs,user)});
})();
async function startSync(fs,user){
  try{
    const NS=window.APP_NS||"";db={doc:p=>fs.doc(NS+p),collection:c=>fs.collection(NS+c)};
    $("#storeNote").innerHTML="Synced to your Plate Log account ("+user.email.replace(/[<>&]/g,"")+"). Each person's log is kept separately. <button class=\"signout\" id=\"signOut\">Sign out</button>";
    db.doc("meta/app").get().then(sn=>{appMeta=sn.exists?sn.data():{};safeRender()}).catch(()=>{appMeta={}});
    $("#signOut").onclick=()=>{if(confirm("Sign out of Plate Log on this device?"))fbAuth.signOut().then(()=>location.reload())};
    let migrated=false;
    db.collection("profiles").onSnapshot(async snap=>{
      const per=snap.docs.filter(d=>d.id!=="list").map(d=>Object.assign({},d.data(),{id:d.id}));
      if(!per.length){ // one-time move from the old shared list to one record per person
        if(migrated)return;migrated=true;const L=snap.docs.find(d=>d.id==="list");
        const items=L?(L.data().items||[]).filter(x=>x&&x.id):profiles;
        for(const it of items){try{await db.doc("profiles/"+it.id).set(JSON.parse(JSON.stringify(it)))}catch(e){}}
        return;
      }
      const now=Date.now();
      const merged=per.map(sp=>{const loc=profiles.find(x=>x.id===sp.id);return loc&&profPending[sp.id]&&now-profPending[sp.id]<4000?loc:sp});
      profiles.filter(x=>!merged.some(m=>m.id===x.id)&&profPending[x.id]).forEach(x=>merged.push(x));
      merged.sort((a,b)=>a.id==="vijay"?-1:b.id==="vijay"?1:String(a.name).localeCompare(String(b.name)));
      if(!merged.some(x=>x.id==="vijay"))merged.unshift({id:"vijay",name:"Vijay",start:194,height:173});
      if(JSON.stringify(merged)!==JSON.stringify(profiles)){profiles=merged;lsSave();renderProfiles();safeRender()}
    },()=>{});
    connectProfile();
  }catch(e){console.error(e)}
}
function safeRender(){
  const a=document.activeElement;
  if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){a.addEventListener("blur",()=>setTimeout(render,50),{once:true});return}
  render();
}
})();
