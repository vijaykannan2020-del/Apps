# Builds the CaseDesk iPhone app on EAS and sends it to TestFlight (same Apple setup as Inbox).
# Start it by changing casedesk/app/ios-build.txt (or Run workflow).
# Secrets (shared with Inbox): EXPO_TOKEN, ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID, ASC_KEY_P8.
# Repo variable CASEDESK_ASC_APP_ID = the app's Apple ID from App Store Connect (needed for TestFlight upload).
name: CaseDesk iPhone build
on:
  push:
    branches: [main]
    paths: ['casedesk/app/ios-build.txt', '.github/workflows/casedesk-ios.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: casedesk-ios, cancel-in-progress: false }
jobs:
  ios:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults: { run: { working-directory: casedesk/app } }
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/casedesk/app/asc.p8
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
      INBOX_CRED: ${{ github.workspace }}/inbox-app/credentials/ios.enc
      ASC_APP_ID: ${{ vars.CASEDESK_ASC_APP_ID || '6836097003' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          for v in EXPO_TOKEN ASC_KEY_P8 EXPO_ASC_KEY_ID EXPO_ASC_ISSUER_ID EXPO_APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; missing=1; else echo "$v ✓"; fi
          done
          [ -z "$missing" ]
      - name: Write App Store Connect key
        run: |
          python3 - <<'PY'
          import os, re
          raw = os.environ['ASC_KEY_P8'].strip()
          body = re.sub(r'\s+', '', re.sub(r'-----(BEGIN|END) PRIVATE KEY-----', '', raw))
          open('asc.p8', 'w').write('-----BEGIN PRIVATE KEY-----\n' + '\n'.join(body[i:i+64] for i in range(0, len(body), 64)) + '\n-----END PRIVATE KEY-----\n')
          PY
          openssl pkey -in asc.p8 -noout && echo "Key file looks valid ✓"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: casedesk/app/package-lock.json }
      - run: npm ci
      - name: Link or create the Expo project
        run: |
          if jq -e '.expo.extra.eas.projectId' app.json >/dev/null; then
            npx -y eas-cli@latest init --non-interactive --force --id "$(jq -r '.expo.extra.eas.projectId' app.json)"
          else
            npx -y eas-cli@latest init --non-interactive --force
            echo "New Expo project: $(jq -r '.expo.extra.eas.projectId' app.json)"
            git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
            git add app.json && git commit -m "CaseDesk: link Expo project" && git pull --rebase -q && git push
          fi
      - name: Signing (reuses Inbox's certificate; App ID + profile made with Apple's API)
        run: |
          pip install --quiet pyjwt cryptography
          set -o pipefail
          python3 scripts/ios-credentials.py | tee /tmp/cred.log
          jq '.build.production.ios.credentialsSource = "local"' eas.json > e.json && mv e.json eas.json
          if grep -q NEW_CREDENTIALS=1 /tmp/cred.log; then
            git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
            git add -f credentials/ios.enc && git commit -m "CaseDesk: save encrypted iPhone signing" && git stash -q && git pull --rebase -q && git push && git stash pop -q
          fi
      - name: Build on EAS (takes 15–40 min)
        run: |
          npx -y eas-cli@latest build --platform ios --profile production --non-interactive --wait --json > /tmp/build.json
          jq -r '.[0].id' /tmp/build.json > /tmp/build-id && echo "Build id: $(cat /tmp/build-id)"
        env: { EAS_BUILD_NO_EXPO_GO_WARNING: 'true' }
      - name: Show why the build failed
        if: failure()
        run: |
          npx -y eas-cli@latest build:list --platform ios --limit 1 --non-interactive --json > /tmp/last.json || true
          jq -r '.[0].error.message // empty, .[0].error.errorCode // empty' /tmp/last.json || true
          for u in $(jq -r '.[0].logFiles[]?' /tmp/last.json 2>/dev/null); do curl -fsSL "$u" | grep -iE "error|fail|❌|entitlement|provision" | tail -40; done || true
      - name: Send to TestFlight
        if: env.ASC_APP_ID != ''
        run: |
          jq --arg k "$EXPO_ASC_KEY_ID" --arg i "$EXPO_ASC_ISSUER_ID" --arg t "$EXPO_APPLE_TEAM_ID" --arg a "$ASC_APP_ID" \
            '.submit.production.ios = {ascApiKeyPath: "./asc.p8", ascApiKeyId: $k, ascApiKeyIssuerId: $i, appleTeamId: $t, ascAppId: $a}' eas.json > e.json && mv e.json eas.json
          npx -y eas-cli@latest submit --platform ios --profile production --id "$(cat /tmp/build-id)" --non-interactive --wait
      - name: Next step
        if: env.ASC_APP_ID == ''
        run: echo "::notice::Build done. Create CaseDesk in App Store Connect and add its Apple ID as repo variable CASEDESK_ASC_APP_ID, then re-run."
