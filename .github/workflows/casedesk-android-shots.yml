# Builds CaseDesk for Android on GitHub (no EAS build used), runs it on an Android emulator and saves screenshots.
name: CaseDesk Android screenshots
on: { workflow_dispatch: {} }
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults: { run: { working-directory: casedesk/app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: casedesk/app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: 17 }
      - run: npm ci
      - name: Build release APK (x86_64 for the emulator)
        run: |
          npx expo prebuild -p android --no-install --clean
          cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon -q
          ls -la app/build/outputs/apk/release/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          working-directory: casedesk/app
          script: bash scripts/android-shots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-screenshots, path: casedesk/app/shots/ }
