# Sends the latest finished iPhone build to TestFlight (no rebuild). Start it by changing inbox-app/ios-submit.txt.
name: Inbox send to TestFlight
on:
  push:
    branches: [main]
    paths: ['inbox-app/ios-submit.txt']
  workflow_dispatch:
jobs:
  submit:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: inbox-app } }
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Write App Store Connect key
        run: |
          python3 - <<'PY'
          import os, re
          body = re.sub(r'\s+', '', re.sub(r'-----(BEGIN|END) PRIVATE KEY-----', '', os.environ['ASC_KEY_P8']))
          open('asc.p8', 'w').write('-----BEGIN PRIVATE KEY-----\n' + '\n'.join(body[i:i+64] for i in range(0, len(body), 64)) + '\n-----END PRIVATE KEY-----\n')
          PY
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: inbox-app/package-lock.json }
      - run: npm ci
      - run: npx -y eas-cli@latest init --non-interactive --force --id 56e21f76-4238-4f34-97fa-a90d652d0133
      - name: Send to TestFlight
        run: |
          jq --arg k "$ASC_KEY_ID" --arg i "$ASC_ISSUER_ID" --arg t "$APPLE_TEAM_ID" \
            '.submit.production.ios = {ascApiKeyPath: "./asc.p8", ascApiKeyId: $k, ascApiKeyIssuerId: $i, appleTeamId: $t, ascAppId: "6835583589"}' eas.json > e.json && mv e.json eas.json
          npx -y eas-cli@latest submit --platform ios --profile production --latest --non-interactive --wait
