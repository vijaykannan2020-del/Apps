name: CaseDesk server probe
on: { workflow_dispatch: {}, push: { branches: [main], paths: ['.github/workflows/dos-probe.yml'] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in /api/health /api/visa-bulletin /api/diag/dos; do echo "== $p"; curl -s -m 60 "https://casedeskapp.duckdns.org$p" | head -c 2500; echo; done
