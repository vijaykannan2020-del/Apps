name: DOS wait-times probe
on: { workflow_dispatch: {}, push: { branches: [main], paths: ['.github/workflows/dos-probe.yml'] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U='https://travel.state.gov/content/travel/en/us-visas/visa-information-resources/global-visa-wait-times.html'
          curl -sL -A 'Mozilla/5.0 CaseDesk' -o p.html -w '%{http_code} %{size_download}\n' "$U"
          python3 - <<'PY'
          import re
          h=open('p.html',encoding='utf-8',errors='ignore').read()
          print('tables', h.count('<table'))
          i=h.find('<table'); print(re.sub(r'\s+',' ',h[i:i+3500]))
          for m in re.finditer(r'(Chennai|Hyderabad|Mumbai|New Delhi|Kolkata)', h): print(m.group(0), re.sub(r'\s+',' ',h[m.start()-100:m.start()+600])); break
          print([m.group(0) for m in re.finditer(r'https?://[^"\']+\.(json|csv|xlsx?)', h)][:10])
          PY
