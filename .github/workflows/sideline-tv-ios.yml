# Builds the Sideline TV iPhone app on GitHub's Mac and sends it to TestFlight (same Apple setup as Immigration Wallet).
# Start it by changing sideline-tv/ios-build.txt (or Run workflow).
# Secrets (shared): EXPO_TOKEN, ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID, ASC_KEY_P8.
# Repo variable SIDELINETV_ASC_APP_ID = the app's Apple ID from App Store Connect (needed for TestFlight upload).
name: Sideline TV iPhone build
on:
  push:
    branches: [main]
    paths: ['sideline-tv/ios-build.txt', '.github/workflows/sideline-tv-ios.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: sideline-tv-ios, cancel-in-progress: false }
jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 120
    defaults: { run: { working-directory: sideline-tv } }
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/sideline-tv/asc.p8
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
      INBOX_CRED: ${{ github.workspace }}/inbox-app/credentials/ios.enc
      ASC_APP_ID: ${{ vars.SIDELINETV_ASC_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          for v in EXPO_TOKEN ASC_KEY_P8 EXPO_ASC_KEY_ID EXPO_ASC_ISSUER_ID EXPO_APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; missing=1; else echo "$v ✓"; fi
          done
          [ -z "$missing" ]
      - name: Write App Store Connect key
        run: |
          python3 - <<'PY'
          import os, re
          raw = os.environ['ASC_KEY_P8'].strip()
          body = re.sub(r'\s+', '', re.sub(r'-----(BEGIN|END) PRIVATE KEY-----', '', raw))
          open('asc.p8', 'w').write('-----BEGIN PRIVATE KEY-----\n' + '\n'.join(body[i:i+64] for i in range(0, len(body), 64)) + '\n-----END PRIVATE KEY-----\n')
          PY
          openssl pkey -in asc.p8 -noout && echo "Key file looks valid ✓"
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Newest released Xcode on the runner
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1); echo "Using $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: sideline-tv/package-lock.json }
      - run: npm ci
      - name: Link or create the Expo project
        run: |
          if jq -e '.expo.extra.eas.projectId' app.json >/dev/null; then
            npx -y eas-cli@latest init --non-interactive --force --id "$(jq -r '.expo.extra.eas.projectId' app.json)"
          else
            npx -y eas-cli@latest init --non-interactive --force
            echo "New Expo project: $(jq -r '.expo.extra.eas.projectId' app.json)"
            git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
            git add app.json && git commit -m "Sideline TV: link Expo project" && git pull --rebase -q && git push
          fi
      - name: Signing (reuses Inbox's certificate; App ID + profile made with Apple's API)
        run: |
          pip install --quiet pyjwt cryptography
          set -o pipefail
          python3 scripts/ios-credentials.py | tee /tmp/cred.log
          jq '.build.production.ios.credentialsSource = "local"' eas.json > e.json && mv e.json eas.json
          if grep -q NEW_CREDENTIALS=1 /tmp/cred.log; then
            git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
            git add -f credentials/ios.enc && git commit -m "Sideline TV: save encrypted iPhone signing" && git stash -q && git pull --rebase -q && git push && git stash pop -q
          fi
      - name: Build (on this Mac, 20–40 min)
        run: |
          npx -y eas-cli@latest build --platform ios --profile production --non-interactive --local --output "$GITHUB_WORKSPACE/build.ipa"
          ls -la "$GITHUB_WORKSPACE/build.ipa"
        env: { EAS_BUILD_NO_EXPO_GO_WARNING: 'true' }
      - name: Keep the app file (if TestFlight isn't linked yet)
        if: env.ASC_APP_ID == ''
        uses: actions/upload-artifact@v4
        with: { name: sideline-tv-ipa, path: build.ipa, retention-days: 7 }
      - name: Send to TestFlight
        if: env.ASC_APP_ID != ''
        run: |
          jq --arg k "$EXPO_ASC_KEY_ID" --arg i "$EXPO_ASC_ISSUER_ID" --arg t "$EXPO_APPLE_TEAM_ID" --arg a "$ASC_APP_ID" \
            '.submit.production.ios = {ascApiKeyPath: "./asc.p8", ascApiKeyId: $k, ascApiKeyIssuerId: $i, appleTeamId: $t, ascAppId: $a}' eas.json > e.json && mv e.json eas.json
          npx -y eas-cli@latest submit --platform ios --profile production --path "$GITHUB_WORKSPACE/build.ipa" --non-interactive --wait
      - name: Next step
        if: env.ASC_APP_ID == ''
        run: echo "::notice::Build done. Create Sideline TV in App Store Connect (bundle ID com.vijaykannan.sidelinetv), add its Apple ID as repo variable SIDELINETV_ASC_APP_ID, then re-run."
