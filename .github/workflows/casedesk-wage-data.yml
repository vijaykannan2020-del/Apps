# Rebuilds CaseDesk's offline prevailing-wage data from DOL's OFLC wage files (new wage year each July 1).
name: CaseDesk wage data
on:
  workflow_dispatch:
  schedule:
    - cron: '23 14 3 7 *'   # July 3 every year
    - cron: '23 14 3 1 *'   # January 3 (DOL sometimes posts updated files)
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: casedesk/app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Find and download the latest OFLC wage zip
        run: |
          URL=$(curl -s -A 'CaseDesk/1.0' https://flag.dol.gov/wage-data/wage-data-downloads | grep -oiE 'https?://[^"]*OFLC_Wages_[0-9]{4}-[0-9]{2}[^"]*\.zip' | sort -t_ -k3 -r | head -1)
          [ -n "$URL" ] || { echo "::error::No OFLC wage zip link found"; exit 1; }
          echo "Using $URL"
          YEAR=$(echo "$URL" | grep -oE '[0-9]{4}-[0-9]{2}' | head -1)
          curl -sL -A 'CaseDesk/1.0' -o /tmp/w.zip "$URL" && mkdir -p /tmp/oflc && unzip -o -j -q /tmp/w.zip -d /tmp/oflc && ls -la /tmp/oflc
          echo "YEAR=$YEAR" >> $GITHUB_ENV
      - run: node scripts/build-wages.mjs /tmp/oflc "$YEAR" && du -sh assets/wages && ls assets/wages | wc -l
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add assets/wages src/data/wageFiles.ts
          git diff --cached --quiet && echo "No change" || { git commit -m "CaseDesk: wage data $YEAR"; git pull --rebase -q; git push; }
