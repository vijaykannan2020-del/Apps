# Builds the real Inbox iPhone app on EAS and sends it to TestFlight.
# Start it by changing inbox-app/ios-build.txt (or Run workflow).
# Secrets: EXPO_TOKEN, ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID, ASC_KEY_P8. Optional repo variable ASC_APP_ID.
name: Inbox iPhone build
on:
  push:
    branches: [main]
    paths: ['inbox-app/ios-build.txt', '.github/workflows/inbox-app-ios.yml']
  schedule:
    - cron: '17 15 1 */2 *'   # 1st of every other month: fresh TestFlight build before the 90-day expiry
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ios:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults: { run: { working-directory: inbox-app } }
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/inbox-app/asc.p8
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
      ASC_APP_ID: '6835583589'
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          for v in EXPO_TOKEN ASC_KEY_P8 EXPO_ASC_KEY_ID EXPO_ASC_ISSUER_ID EXPO_APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; missing=1; else echo "$v ✓ (${#v} set)"; fi
          done
          [ -z "$missing" ]
      - name: Write App Store Connect key
        run: |
          python3 - <<'PY'
          import os, re
          raw = os.environ['ASC_KEY_P8'].strip()
          body = re.sub(r'-----(BEGIN|END) PRIVATE KEY-----', '', raw)
          body = re.sub(r'\s+', '', body)
          pem = '-----BEGIN PRIVATE KEY-----\n' + '\n'.join(body[i:i+64] for i in range(0, len(body), 64)) + '\n-----END PRIVATE KEY-----\n'
          open('asc.p8', 'w').write(pem)
          PY
          openssl pkey -in asc.p8 -noout && echo "Key file looks valid ✓"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: inbox-app/package-lock.json }
      - run: npm ci
      - name: Link Expo project
        run: npx -y eas-cli@latest init --non-interactive --force --id 56e21f76-4238-4f34-97fa-a90d652d0133
      - name: Set up updates
        run: npx -y eas-cli@latest update:configure --platform all --non-interactive || true
      - name: Signing certificate (made once with Apple's API, then reused)
        run: |
          pip install --quiet pyjwt cryptography
          python3 scripts/ios-credentials.py | tee /tmp/cred.log
          jq '.build.production.ios.credentialsSource = "local"' eas.json > e.json && mv e.json eas.json
          if grep -q NEW_CREDENTIALS=1 /tmp/cred.log; then
            git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
            git add -f credentials/ios.enc && git commit -m "Save encrypted iPhone signing certificate" && git stash -q && git pull --rebase -q && git push && git stash pop -q
          fi
      - name: Build on EAS (takes 15–40 min)
        run: npx -y eas-cli@latest build --platform ios --profile production --non-interactive --wait
        env: { EAS_BUILD_NO_EXPO_GO_WARNING: 'true' }
      - name: Send to TestFlight
        if: env.ASC_APP_ID != ''
        run: |
          jq --arg k "$EXPO_ASC_KEY_ID" --arg i "$EXPO_ASC_ISSUER_ID" --arg t "$EXPO_APPLE_TEAM_ID" --arg a "$ASC_APP_ID" \
            '.submit.production.ios = {ascApiKeyPath: "./asc.p8", ascApiKeyId: $k, ascApiKeyIssuerId: $i, appleTeamId: $t, ascAppId: $a}' eas.json > e.json && mv e.json eas.json
          npx -y eas-cli@latest submit --platform ios --profile production --latest --non-interactive --wait
      - name: Next step
        if: env.ASC_APP_ID == ''
        run: echo "Build done. Add the App Store Connect app ID as repo variable ASC_APP_ID to send builds to TestFlight."
