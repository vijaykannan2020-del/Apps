services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Your private Matrix server (federation off: it only talks to the bridges and your app)
  synapse:
    image: matrixdotorg/synapse:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/synapse:/data

  whatsapp:
    image: dock.mau.dev/mautrix/whatsapp:latest
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_healthy
    volumes:
      - ./data/whatsapp:/data

  instagram:
    image: dock.mau.dev/mautrix/meta:ig-latest
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_healthy
    volumes:
      - ./data/instagram:/data

  messenger:
    image: dock.mau.dev/mautrix/meta:latest
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_healthy
    volumes:
      - ./data/messenger:/data

  # Turns Synapse push events into iPhone/web notifications
  pushgw:
    build: ./pushgw
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./data/pushgw:/data
      # read-only: lets the push service check whether WhatsApp/Instagram/Messenger are still logged in
      - ./data/whatsapp:/bridges/whatsapp:ro
      - ./data/instagram:/bridges/instagram:ro
      - ./data/messenger:/bridges/messenger:ro

  # Relay for voice/video calls (TURN). Config is written by auto-update.sh into data/turn/
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data/turn:/etc/coturn-cfg:ro
    command: ["-c", "/etc/coturn-cfg/turnserver.conf"]

  # HTTPS + serves your inbox app; /_matrix goes to Synapse on the same domain
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - synapse
      - pushgw
    environment:
      DOMAIN: ${DOMAIN}
      CASEDESK_SITE: ${CASEDESK_SITE:-http://casedesk.localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - ./data/caddy:/data
