<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Inbox">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Inbox</title>
<style>
/* Same design language as Cinema Book / Plate Log / SpeakNative:
   Apple-style neutrals, light + dark, floating glass dock at the bottom,
   nothing important in the top-right corner (the foldable's clock and Wi-Fi pill sit there). */
:root{
  color-scheme:light;
  --bg:#F5F5F7; --paper:#FFFFFF; --ink:#1D1D1F; --soft:#6E6E73; --line:#D2D2D7; --fill:#E8E8ED;
  --primary:#1D1D1F; --primary-text:#FFFFFF; --other:#E9E9EB; --other-text:#1D1D1F;
  --dock:rgba(255,255,255,.62); --dock-edge:rgba(255,255,255,.75); --dock-on:rgba(0,0,0,.08);
  --dock-shadow:0 10px 30px #0000001f,0 2px 6px #00000014;
  --red:#D70015; --wa:#25D366; --ig:#E1306C; --fb:#0A7CFF;
  --display:-apple-system,"SF Pro Display",system-ui,"Helvetica Neue",sans-serif;
  --body:-apple-system,"SF Pro Text",system-ui,"Helvetica Neue",sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#000000; --paper:#1C1C1E; --ink:#FFFFFF; --soft:#98989F; --line:#2C2C2E; --fill:#2C2C2E;
  --primary:#FFFFFF; --primary-text:#000000; --other:#262628; --other-text:#FFFFFF;
  --dock:rgba(58,58,62,.5); --dock-edge:rgba(255,255,255,.16); --dock-on:rgba(255,255,255,.18);
  --dock-shadow:0 12px 34px #000000a0,0 2px 8px #00000066; --red:#FF6961;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --paper:#1C1C1E; --ink:#FFFFFF; --soft:#98989F; --line:#2C2C2E; --fill:#2C2C2E;
  --primary:#FFFFFF; --primary-text:#000000; --other:#262628; --other-text:#FFFFFF;
  --dock:rgba(58,58,62,.5); --dock-edge:rgba(255,255,255,.16); --dock-on:rgba(255,255,255,.18);
  --dock-shadow:0 12px 34px #000000a0,0 2px 8px #00000066; --red:#FF6961;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:calc(16px * var(--fs,1));line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:var(--ink)}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* login */
#login{height:100%;display:grid;place-items:center;padding:24px;padding-top:calc(24px + var(--st))}
#login form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
#login .logo{width:64px;height:64px;border-radius:16px;margin-bottom:8px}
#login h1{font-family:var(--display);font-size:calc(34px * var(--fs,1));font-weight:800;letter-spacing:-.02em;margin:0}
#login p{color:var(--soft);margin:0 0 10px}
.field{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;outline:none;width:100%;font-size:calc(17px * var(--fs,1))}
.field:focus{border-color:var(--ink)}
.btn{background:var(--primary);color:var(--primary-text);border-radius:14px;padding:15px;font-weight:600;font-size:calc(17px * var(--fs,1))}
.btn:disabled{opacity:.5}
.err{color:var(--red);font-size:calc(14px * var(--fs,1));min-height:20px}

/* shell */
#app{display:flex;height:100%;overflow:hidden}
#side{width:400px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;position:relative;background:var(--bg);padding-top:var(--st);min-height:0}
#chat{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);position:relative}
@media (max-width:760px){
  #side{width:100%;border:0}
  #chat{position:fixed;inset:0;transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:30;box-shadow:-12px 0 30px #0000001a}
  #app.open #chat{transform:none}
}
.view{flex:1;display:flex;flex-direction:column;min-height:0}

/* list header: title + search, all on the left/centre */
.head{padding:10px 20px 4px}
.head h2{font-family:var(--display);font-size:calc(34px * var(--fs,1));font-weight:800;letter-spacing:-.02em;margin:0}
.head .sub{color:var(--soft);font-size:calc(14px * var(--fs,1));min-height:20px}
.search{display:flex;align-items:center;gap:8px;margin:6px 16px 8px;padding:9px 12px;border-radius:12px;background:var(--fill);color:var(--soft)}
.search input{flex:1;border:0;background:none;outline:none;font-size:calc(17px * var(--fs,1));min-width:0}
.swipe{position:relative;border-radius:14px;overflow:hidden}
.swipe .bg{position:absolute;inset:0;display:flex;visibility:hidden}
.swipe.swiping .bg{visibility:visible}
.swipe .bg span{flex:1;display:flex;align-items:center;padding:0 22px;color:#fff;font-weight:600;font-size:calc(15px * var(--fs,1))}
.swipe .bg .l{background:#0A84FF}
.swipe .bg .r{background:#8E8E93;justify-content:flex-end}
.swipe .row{background:var(--bg);touch-action:pan-y;position:relative}
.msg{touch-action:pan-y}
.kinds{display:flex;gap:8px;padding:2px 16px 8px}
.sbar{display:flex;align-items:center;gap:2px;padding-left:4px}
.sbar .search{flex:1;margin-left:12px}
#qCancel{display:grid;place-items:center;width:40px;height:40px;color:var(--ink);margin-left:6px}
#qCancel:not([hidden]) + .search{margin-left:0}
/* keyboard open: the floating dock gets out of the way */
#app.kb .nav,#app.kb #newver{display:none}
#app.kb #list,#app.kb #acctView{padding-bottom:16px}
/* fit the app to the area above the keyboard (iOS doesn't resize the page itself) */
#app{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%)}
@media (max-width:760px){#chat{top:var(--vvt,0px);bottom:auto;height:var(--vvh,100%)}}
#app.kb form#comp{padding-bottom:8px}
/* search mode: hide the big title, keep filters */
#app.searching .head{display:none}
#app.searching #side{padding-top:calc(var(--st) + 8px)}
.kinds button{padding:6px 14px;border-radius:999px;background:var(--fill);color:var(--ink);font-size:calc(14px * var(--fs,1));font-weight:600}
.kinds button.on{background:var(--primary);color:var(--primary-text)}
.kinds button i{font-style:normal;opacity:.7;margin-left:4px;font-weight:500}
.search svg{width:18px;height:18px}
#list{list-style:none;margin:0;padding:0 8px calc(100px + var(--sb));overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.row{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;cursor:pointer}
.row:active,.row.on{background:var(--fill)}
@media (hover:hover){.row:hover{background:var(--fill)}}
.row .meta{flex:1;min-width:0;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:-10px}
.row:last-child .meta{border-bottom:0}
.row .l1,.row .l2{display:flex;align-items:center;gap:8px}
.row .name{flex:1;font-weight:600;font-size:calc(17px * var(--fs,1));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .time{font-size:calc(14px * var(--fs,1));color:var(--soft)}
.row .prev{flex:1;color:var(--soft);font-size:calc(15px * var(--fs,1));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.unread .name{font-weight:700}
.row.unread .prev{color:var(--ink)}
.row.unread .time{color:var(--ink);font-weight:600}
.badge{background:var(--primary);color:var(--primary-text);font-size:calc(12px * var(--fs,1));font-weight:700;border-radius:999px;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center}
.empty-list{color:var(--soft);text-align:center;padding:48px 28px;line-height:1.5}
.empty-list .btn{display:inline-block;margin-top:16px;padding:12px 20px}

/* avatars */
.av{position:relative;flex-shrink:0;width:52px;height:52px}
.av .c{width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:600;color:#fff;font-size:calc(20px * var(--fs,1))}
.av img{width:100%;height:100%;object-fit:cover}
.av .net{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;border:2.5px solid var(--bg);display:grid;place-items:center}
.av .net svg{width:11px;height:11px;fill:#fff}
.av.sm{width:38px;height:38px}.av.sm .c{font-size:calc(15px * var(--fs,1))}
.av.sm .net{width:16px;height:16px;border-width:2px}.av.sm .net svg{width:9px;height:9px}

/* floating glass dock (same as Cinema Book) */
.nav{position:absolute;left:50%;transform:translateX(-50%);bottom:max(12px,var(--sb));width:calc(100% - 28px);max-width:520px;display:flex;padding:6px;gap:2px;border:1px solid var(--dock-edge);border-radius:999px;background:var(--paper);box-shadow:var(--dock-shadow),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.12);z-index:10}
@supports ((backdrop-filter:blur(20px)) or (-webkit-backdrop-filter:blur(20px))){.nav{background:var(--dock);backdrop-filter:blur(26px) saturate(190%) brightness(1.08);-webkit-backdrop-filter:blur(26px) saturate(190%) brightness(1.08)}}
@media (prefers-reduced-transparency:reduce){.nav{background:var(--paper);backdrop-filter:none;-webkit-backdrop-filter:none}}
.nav button{flex:1 1 0;min-width:0;border-radius:999px;padding:8px 2px 7px;font-size:calc(10px * var(--fs,1));font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink);opacity:.72;position:relative;transition:background .25s,opacity .25s}
.nav button.on{opacity:1;background:var(--dock-on);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 1px rgba(255,255,255,.06)}
.nav button svg{width:22px;height:22px}
.nav button .dot{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--red);color:#fff;font-size:calc(10px * var(--fs,1));font-weight:700;line-height:16px;text-align:center}
.nav .brand svg.f{fill:currentColor;stroke:none}
@media (prefers-reduced-motion:reduce){.nav button,#chat{transition:none}}

/* chat */
.chead{display:flex;align-items:center;gap:10px;padding:calc(8px + var(--st)) 16px 8px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
@supports ((backdrop-filter:blur(20px)) or (-webkit-backdrop-filter:blur(20px))){.chead{background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}}
.chead .t{flex:1;min-width:0}
.chead .t b{display:block;font-size:calc(17px * var(--fs,1));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .t span{font-size:calc(13px * var(--fs,1));color:var(--soft)}
#back{display:none;align-items:center;gap:2px;color:var(--ink);font-size:calc(17px * var(--fs,1));padding:8px 6px;border-radius:12px}
#back svg{width:24px;height:24px}
@media (max-width:760px){#back{display:flex}}
#tl{flex:1;overflow-y:auto;padding:12px 14px 8px;display:flex;flex-direction:column;gap:2px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
/* never let messages be squashed when the chat is longer than the screen (photos collapsed to 0 height) */
#tl > *{flex-shrink:0}
.sechead{list-style:none;font-size:calc(13px * var(--fs,1));font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.04em;padding:14px 12px 6px}
.hit .prev mark{background:none;color:var(--ink);font-weight:700}
.hit .who2{font-weight:600;color:var(--ink)}
.day{align-self:center;font-size:calc(12px * var(--fs,1));color:var(--soft);font-weight:600;margin:14px 0 8px}
.who{font-size:calc(12px * var(--fs,1));color:var(--soft);margin:8px 0 2px 12px;font-weight:600}
.msg{max-width:min(78%,560px);padding:8px 13px;border-radius:20px;background:var(--other);color:var(--other-text);word-wrap:break-word;white-space:pre-wrap;align-self:flex-start;position:relative;font-size:calc(16px * var(--fs,1))}
.msg.me{align-self:flex-end;background:var(--primary);color:var(--primary-text)}
.msg.gap{margin-top:6px}
.msg.notice{background:var(--paper);border:1px solid var(--line);color:var(--ink)}
.msg.media{padding:0;background:transparent;border-radius:18px;overflow:hidden}
.msg.media img,.msg.media video{display:block;max-width:100%;max-height:340px;min-width:90px;min-height:70px;background:var(--fill)}
.msg a{color:inherit;text-decoration:underline}
.msg .ts{font-size:calc(11px * var(--fs,1));opacity:.55;margin-left:8px;float:right;margin-top:6px}
.msg.pending{opacity:.55}
.msg.failed{background:var(--red);color:#fff}
.msg.deleted{font-style:italic;color:var(--soft);background:transparent;border:1px dashed var(--line)}
.quote{display:block;font-size:calc(13px * var(--fs,1));opacity:.7;border-left:2px solid currentColor;padding-left:8px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reacts{display:flex;gap:4px;margin:-4px 10px 4px;flex-wrap:wrap}
.reacts.me{align-self:flex-end}
.reacts span{background:var(--paper);border:1px solid var(--line);border-radius:999px;font-size:calc(12px * var(--fs,1));padding:1px 7px}
.file{display:flex;gap:8px;align-items:center;text-decoration:none!important}
.more{align-self:center;color:var(--soft);font-size:calc(12px * var(--fs,1));padding:8px}
.extlink{display:block;margin-top:6px;font-weight:600;text-decoration:none!important;opacity:.9}
.msg.hasmedia{padding:4px 4px 8px}
.msg.hasmedia img,.msg.hasmedia video{display:block;max-width:100%;max-height:340px;border-radius:16px}
.msg.hasmedia .extlink{padding:0 8px}
.msg .cap{padding:6px 8px 0;white-space:pre-wrap}
.photofail{display:block;padding:12px 14px;border-radius:16px;background:var(--fill);color:var(--ink);font-size:calc(14px * var(--fs,1));text-align:left}
.msg.media img{min-width:120px;min-height:90px}
.reelthumb{position:relative;display:block;cursor:pointer}
.reelthumb img{display:block;max-width:100%;max-height:340px;border-radius:16px;min-width:160px;min-height:200px;object-fit:cover;background:var(--fill)}
.reelthumb .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-size:calc(22px * var(--fs,1));padding-left:4px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px 2px}
#chips button{background:var(--paper);border:1px solid var(--line);padding:7px 14px;border-radius:999px;font-size:calc(14px * var(--fs,1));font-weight:600;white-space:nowrap}
.hint{margin:10px auto;max-width:440px;font-size:calc(14px * var(--fs,1));color:var(--soft);background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;line-height:1.5}
.hint b{color:var(--ink)}
form#comp{display:flex;align-items:flex-end;gap:8px;padding:8px 12px calc(8px + var(--sb));background:var(--bg);border-top:1px solid var(--line)}
#txt{flex:1;resize:none;font-size:max(16px, calc(16px * var(--fs,1)))!important;border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:9px 15px;outline:none;max-height:140px;line-height:1.35;font-size:calc(16px * var(--fs,1))}
#send{width:38px;height:38px;border-radius:50%;background:var(--primary);color:var(--primary-text);display:grid;place-items:center;flex-shrink:0}
#send svg{width:20px;height:20px}
#attach{width:38px;height:38px;display:grid;place-items:center;color:var(--soft);flex-shrink:0;cursor:pointer}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
#none{flex:1;display:grid;place-items:center;color:var(--soft)}

/* accounts page */
#acctView{overflow-y:auto;padding-bottom:calc(110px + var(--sb))}
.group{margin:10px 16px 18px}
.group h4{margin:0 0 6px 4px;font-size:calc(13px * var(--fs,1));font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--paper);border-radius:16px;overflow:hidden}
.acct{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.acct + .acct{border-top:1px solid var(--line)}
.acct .dot2{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.acct .dot2 svg{width:18px;height:18px;fill:#fff}
.acct .tx{flex:1;min-width:0}
.acct b{display:block;font-weight:600}
.acct small{color:var(--soft);font-size:calc(13px * var(--fs,1))}
.acct .go{color:var(--soft);font-size:calc(20px * var(--fs,1))}
.acct.danger b{color:var(--red)}
.foot{color:var(--soft);font-size:calc(12px * var(--fs,1));text-align:center;margin:8px 0}
#status{font-size:calc(12px * var(--fs,1));color:var(--soft);text-align:center}
.row,.msg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.row .ic{font-size:calc(13px * var(--fs,1));color:var(--soft);margin-left:2px}
.badge.muted{background:var(--soft)}
.badge.dot{min-width:12px;width:12px;height:12px;padding:0}
.row.arch .av .c{background:var(--fill)!important;color:var(--ink)}
.row.arch .name{font-weight:600}
.msg .ts .tick{margin-left:3px;letter-spacing:-3px}
.msg .ts .tick.read{color:#34B7F1;opacity:1}
.msg.me .ts .tick.read{color:#34B7F1}
.quote{cursor:pointer}
.reacts span{cursor:pointer}
.reacts span.mine{border-color:var(--ink);font-weight:600}
.msg.flash{outline:2px solid #34B7F1;outline-offset:2px}
#replyBar{display:flex;align-items:center;gap:10px;padding:8px 14px 0;background:var(--bg)}
#replyBar .rb{flex:1;min-width:0;border-left:3px solid var(--ink);padding:2px 10px;font-size:calc(14px * var(--fs,1))}
#replyBar .rb b{display:block;font-size:calc(13px * var(--fs,1))}
#replyBar .rb span{display:block;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#replyBar button{width:30px;height:30px;border-radius:50%;background:var(--fill);font-size:calc(16px * var(--fs,1))}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
#veil.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;z-index:61;background:var(--paper);border-radius:22px 22px 0 0;padding:8px 12px calc(14px + var(--sb));transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px #0003}
#sheet.on{transform:none}
#sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 10px}
#sheet .st{font-size:calc(13px * var(--fs,1));color:var(--soft);text-align:center;margin:0 8px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sheet .emojis{display:flex;justify-content:space-around;background:var(--fill);border-radius:16px;padding:8px;margin-bottom:10px}
#sheet .emojis button{font-size:calc(28px * var(--fs,1));width:46px;height:46px;border-radius:50%}
#sheet .emojis button.mine{background:var(--paper)}
#sheet .items{background:var(--fill);border-radius:16px;overflow:hidden}
#sheet .items button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 16px;font-size:calc(17px * var(--fs,1));text-align:left}
#sheet .items button + button{border-top:1px solid var(--line)}
#sheet .items button.danger{color:var(--red)}
#sheet .items button span{font-size:calc(19px * var(--fs,1));width:24px;text-align:center}
#sheet .cancel{display:block;width:100%;margin-top:8px;padding:14px;border-radius:16px;background:var(--fill);font-size:calc(17px * var(--fs,1));font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 110px);background:var(--primary);color:var(--primary-text);padding:9px 16px;border-radius:999px;font-size:calc(14px * var(--fs,1));font-weight:600;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
#newver{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(12px,var(--sb)) + 74px);z-index:11;background:var(--primary);color:var(--primary-text);border-radius:999px;padding:9px 16px;font-size:calc(14px * var(--fs,1));font-weight:600;box-shadow:var(--dock-shadow);white-space:nowrap}

.seg{display:flex;gap:6px;padding:4px 14px 12px}
.seg button{flex:1;padding:9px 4px;border-radius:10px;background:var(--fill);font-weight:600;font-size:calc(14px * var(--fs,1))}
.seg button.on{background:var(--primary);color:var(--primary-text)}
.setlabel{padding:12px 16px 6px;font-weight:600}
.dots{display:flex;gap:12px;padding:4px 16px 14px}
.dots button{width:34px;height:34px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 1px var(--line)}
.dots button.on{box-shadow:0 0 0 2px var(--ink)}

/* iPhone zooms into any text box under 16px: keep inputs at 16px+ whatever the text size setting */
input,textarea,.field,.search input{font-size:max(16px, calc(16px * var(--fs,1)))!important}
html,body{overflow-x:hidden;touch-action:manipulation}

/* ---- Liquid Glass ---- */
:root{--glass-bar:rgba(248,248,250,.66);--glass:rgba(250,250,252,.42);--glass-edge:rgba(255,255,255,.55);--glass-shine:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -1px 0 rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass-bar:rgba(16,16,20,.62);--glass:rgba(28,28,32,.36);--glass-edge:rgba(255,255,255,.14);--glass-shine:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--glass-bar:rgba(16,16,20,.62);--glass:rgba(28,28,32,.36);--glass-edge:rgba(255,255,255,.14);--glass-shine:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.35)}
.nav{background:var(--glass)!important;border-color:var(--glass-edge)!important;box-shadow:0 12px 34px rgba(0,0,0,.18),var(--glass-shine)!important;
  -webkit-backdrop-filter:blur(14px) saturate(210%) brightness(1.06)!important;backdrop-filter:blur(14px) saturate(210%) brightness(1.06)!important}
.nav button.on{background:rgba(127,127,127,.2)!important}
/* chat header + message bar float over the conversation as glass */
.chead{position:absolute;top:0;left:0;right:0;z-index:6;border-bottom:1px solid var(--glass-edge)!important;background:var(--glass-bar)!important;
  -webkit-backdrop-filter:blur(24px) saturate(200%);backdrop-filter:blur(24px) saturate(200%);box-shadow:var(--glass-shine)}
#cbottom{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--glass-bar);border-top:1px solid var(--glass-edge);
  -webkit-backdrop-filter:blur(24px) saturate(200%);backdrop-filter:blur(24px) saturate(200%);box-shadow:var(--glass-shine)}
#cbottom form#comp,#cbottom #chips,#cbottom #replyBar{background:transparent!important;border-top:0!important}
#cbottom #txt{background:rgba(127,127,127,.12);border-color:var(--glass-edge)}
#tl{padding-top:calc(var(--chh,60px) + 10px)!important;padding-bottom:calc(var(--cbh,64px) + 10px)!important}
@media (prefers-reduced-transparency:reduce){.nav,.chead,#cbottom{background:var(--paper)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
</style>
</head>
<body>

<div id="login" hidden>
  <form id="loginForm">
    <img class="logo" src="icon-192.png" alt="">
    <h1>Inbox</h1>
    <p>All your chats, one place.</p>
    <input class="field" id="lu" placeholder="Username" autocomplete="username" autocapitalize="none" required>
    <input class="field" id="lp" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn" id="lb">Log in</button>
    <div class="err" id="le"></div>
    <p class="foot" id="lver"></p>
  </form>
</div>

<div id="app" hidden>
  <aside id="side">
    <section class="view" id="listView">
      <div class="head"><h2 id="title">Inbox</h2><div class="sub" id="status"></div></div>
      <div class="sbar">
        <button type="button" id="qCancel" hidden aria-label="Close search"><svg class="i" viewBox="0 0 24 24" style="stroke-width:2.2"><path d="M15 18l-6-6 6-6"/></svg></button>
        <label class="search">
          <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Search" autocomplete="off" enterkeyhint="search">

      </div>
      <div class="kinds" id="kinds"></div>
      <ul id="list"></ul>
    </section>
    <section class="view" id="acctView" hidden>
      <div class="head"><h2>Accounts</h2><div class="sub">Open a setup chat, send login, follow the steps.</div></div>
      <div class="group"><h4>Connected apps</h4><div class="card" id="accts"></div></div>
      <div class="group"><h4>Appearance</h4><div class="card" id="appearance">
        <div class="setlabel">Text size</div><div class="seg" id="segFs"></div>
        <div class="setlabel">Theme</div><div class="seg" id="segTheme"></div>
        <div class="setlabel">Accent colour</div><div class="dots" id="dotsAccent"></div>
      </div></div>
      <div class="group"><h4>App</h4><div class="card">
        <button class="acct" id="updBtn">
          <span class="dot2" style="background:#30B0C7"><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 0 1 7.7 5.9h-2.1A6 6 0 0 0 6.3 9H9v2H3V5h2v2.3A8 8 0 0 1 12 4zm-7.7 10.1h2.1A6 6 0 0 0 17.7 15H15v-2h6v6h-2v-2.3A8 8 0 0 1 4.3 14.1z"/></svg></span>
          <span class="tx"><b>Check for updates</b><small id="updTxt"></small></span><span class="go">›</span>
        </button>
      </div></div>
      <div class="group"><h4>This device</h4><div class="card">
        <button class="acct" id="notifBtn">
          <span class="dot2" style="background:#8E8E93"><svg viewBox="0 0 24 24"><path d="M12 22a2.5 2.5 0 0 0 2.5-2.5h-5A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5.5-6.8V3.5a1.5 1.5 0 0 0-3 0v.7A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2z"/></svg></span>
          <span class="tx"><b>Notifications</b><small id="notifTxt">Off</small></span><span class="go">›</span>
        </button>
        <button class="acct danger" id="logout"><span class="tx"><b>Log out</b></span></button>
      </div></div>
      <p class="foot" id="who"></p>
    </section>
    <button id="newver" hidden>New version ready · Tap to update</button>
    <nav class="nav" id="nav"></nav>
  </aside>

  <main id="chat">
    <div id="none">Pick a chat</div>
    <div class="chead" id="chead" hidden>
      <button id="back" aria-label="Back"><svg class="i" viewBox="0 0 24 24" style="stroke-width:2.2"><path d="M15 18l-6-6 6-6"/></svg>Chats</button>
      <div id="cav"></div>
      <div class="t"><b id="cname"></b><span id="csub"></span></div>
    </div>
    <div id="tl" hidden></div>
    <div id="cbottom" hidden>
    <div id="chips" hidden></div>
    <div id="replyBar" hidden><div class="rb"><b id="rbTitle"></b><span id="rbText"></span></div><button type="button" id="rbClose" aria-label="Cancel">✕</button></div>
    <form id="comp" hidden>
      <label id="attach" for="file" aria-label="Attach photo or file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg></label>
      <input type="file" id="file" class="vh" multiple>
      <textarea id="txt" rows="1" placeholder="Message"></textarea>
      <button id="send" aria-label="Send"><svg class="i" viewBox="0 0 24 24" style="stroke-width:2.4"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </form>
    </div>
  </main>
</div>

<div id="veil"></div>
<div id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div id="toast" role="status"></div>
<script>
'use strict';
const APP_VERSION = 30; // bump on every change (shown in Accounts)
const $ = s => document.querySelector(s);
const enc = encodeURIComponent;
const sleep = ms => new Promise(r => setTimeout(r, ms));
window.addEventListener('error', e => { try { const t = document.getElementById('toast'); t.textContent = 'App error: ' + e.message; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 4000); } catch {} });
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} },
};

const ICON = {
  whatsapp:'<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 13.9c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.6 2 1.1 1 2 1.3 2.3 1.4.3.1.4.1.6-.1l.9-1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.1.1.7-.1 1.3z"/></svg>',
  instagram:'<svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 8.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4zM17.3 5.5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zM12 2c-2.7 0-3 0-4.1.1C4.3 2.3 2.3 4.3 2.1 7.9 2 9 2 9.3 2 12s0 3 .1 4.1c.2 3.6 2.2 5.6 5.8 5.8 1.1.1 1.4.1 4.1.1s3 0 4.1-.1c3.6-.2 5.6-2.2 5.8-5.8.1-1.1.1-1.4.1-4.1s0-3-.1-4.1c-.2-3.6-2.2-5.6-5.8-5.8C15 2 14.7 2 12 2z"/></svg>',
  messenger:'<svg viewBox="0 0 24 24"><path d="M12 2C6.4 2 2 6.1 2 11.7c0 2.9 1.2 5.5 3.2 7.2v3.1l3-1.6c1.2.3 2.5.5 3.8.5 5.6 0 10-4.1 10-9.7S17.6 2 12 2zm1 12.9l-2.6-2.7-5 2.7 5.5-5.8 2.6 2.7 4.9-2.7-5.4 5.8z"/></svg>',
};
const NETS = {
  whatsapp:{label:'WhatsApp', color:'var(--wa)', bot:'whatsappbot',
    hint:'Tap <b>login</b>, then <b>login phone</b>, and send your number with country code. Then in WhatsApp go to Settings → Linked devices → Link a device → <b>Link with phone number instead</b> and type the 8-character code shown here.'},
  instagram:{label:'Instagram', color:'var(--ig)', bot:'instagrambot',
    hint:'Tap <b>login</b>, then <b>login android</b>. Send your username and password, choose <b>Text message</b> for the code, then tap your profile.'},
  messenger:{label:'Messenger', color:'var(--fb)', bot:'messengerbot',
    hint:'Send <b>login</b> and follow the steps. It will ask for cookies from messenger.com (or facebook.com) while you are logged in on a computer browser. Paste them here.'},
};
const PREFIX = { whatsapp: '!wa', instagram: '!ig', messenger: '!fb' };
const CMD_RE = /^(login|list-logins|help|cancel|logout|ping)(\s|$)/i;
// Bridge commands work in every setup chat when prefixed (plain ones only work in the first one)
function withPrefix(r, text) {
  const n = botNetOf(r);
  return n && CMD_RE.test(text.trim()) ? PREFIX[n] + ' ' + text.trim() : text;
}
const PALETTE = ['#5b6cff','#e0664f','#2fa37a','#c25bd6','#d99a2b','#3c9bd6','#d6517a','#6e8a3a'];

const S = {
  token: store.get('tok'), userId: store.get('uid'), since: null,
  rooms: new Map(), filter: 'all', q: '', current: null, firstSync: true, view: 'list',
  presence: new Map(),
  muted: new Set(), showArchived: false, replyTo: null, editing: null, kind: 'all', keepUnread: new Set(),
};
const domain = () => (S.userId || '').split(':').slice(1).join(':');
const botId = net => `@${NETS[net].bot}:${domain()}`;

// ---------- API ----------
async function api(method, path, body) {
  const headers = {};
  if (S.token) headers.Authorization = 'Bearer ' + S.token;
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  const res = await fetch(path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    if (res.status === 401 && data.errcode === 'M_UNKNOWN_TOKEN') logout(true);
    const e = new Error(data.error || res.statusText); e.status = res.status; e.retry = data.retry_after_ms; throw e;
  }
  return data;
}

// ---------- media ----------
const mediaCache = new Map();
const mediaReady = new Map();   // key -> blob URL once loaded, so redraws show the picture instantly
const mxcParts = m => { const x = /^mxc:\/\/([^/]+)\/(.+)$/.exec(m || ''); return x ? [x[1], x[2]] : null; };
function mediaUrl(mxc, size) {
  const key = mxc + '|' + (size || 0);
  if (mediaCache.has(key)) return mediaCache.get(key);
  const p = (async () => {
    const [s, id] = mxcParts(mxc);
    const path = size
      ? `/_matrix/client/v1/media/thumbnail/${enc(s)}/${enc(id)}?width=${size}&height=${size}&method=${size <= 96 ? 'crop' : 'scale'}`
      : `/_matrix/client/v1/media/download/${enc(s)}/${enc(id)}`;
    const res = await fetch(path, { headers: { Authorization: 'Bearer ' + S.token } });
    if (!res.ok) throw new Error('media ' + res.status);
    return URL.createObjectURL(await res.blob());
  })();
  mediaCache.set(key, p);
  p.then(u => mediaReady.set(key, u), () => mediaCache.delete(key));
  return p;
}
// Photos: try the preview size, then the full file; if both fail, show a visible retry note instead of an invisible empty image
function loadPhoto(img, mxc, size) {
  const ready = mediaReady.get(mxc + '|' + size) || mediaReady.get(mxc + '|0');
  if (ready) { img.src = ready; return; }
  const fail = err => {
    const note = document.createElement('button'); note.type = 'button'; note.className = 'photofail';
    note.textContent = '📷 Photo couldn\'t load' + (err && err.message ? ' (' + err.message + ')' : '') + ' · tap to retry';
    note.onclick = e => { e.stopPropagation(); mediaCache.delete(mxc + '|' + size); mediaCache.delete(mxc + '|0'); note.replaceWith(img); loadPhoto(img, mxc, size); };
    if (img.isConnected) img.replaceWith(note); else img._fail = note;
  };
  if (!mxcParts(mxc)) { fail(new Error('no file')); return; }
  mediaUrl(mxc, size)
    .then(u => { img.src = u; })
    .catch(() => mediaUrl(mxc, 0).then(u => { img.src = u; }))
    .catch(fail);
  img.onerror = () => { if (img.src && img.src.startsWith('blob:') && !img._triedFull) { img._triedFull = true; mediaUrl(mxc, 0).then(u => { img.src = u; }).catch(fail); } else fail(new Error('could not display')); };
}
function loadInto(el, mxc, size, attr = 'src') {
  if (!mxcParts(mxc)) return;
  const ready = mediaReady.get(mxc + '|' + (size || 0));
  if (ready) { el[attr] = ready; return; }
  mediaUrl(mxc, size).then(u => { el[attr] = u; }).catch(() => {});
}

// ---------- rooms ----------
function room(id) {
  let r = S.rooms.get(id);
  if (!r) {
    r = { id, name: null, avatar: null, members: new Map(), heroes: [], joined: 0, events: [], idx: new Map(), txns: new Map(),
      reacts: new Map(), reactIdx: new Map(), pendingEdits: new Map(), unread: 0, net: null, bridgeName: null, bridgeAvatar: null,
      isSpace: false, prevBatch: undefined, lastTs: 0, loading: false, lastReceipt: null,
      tags: {}, markedUnread: false, readBy: new Map(), typing: [] };
    S.rooms.set(id, r);
  }
  return r;
}
function netFrom(s) {
  s = (s || '').toLowerCase();
  if (s.includes('whatsapp')) return 'whatsapp';
  if (s.includes('instagram')) return 'instagram';
  if (s.includes('facebook') || s.includes('messenger') || s.includes('meta')) return 'messenger';
  return null;
}
function applyState(r, ev) {
  const c = ev.content || {};
  switch (ev.type) {
    case 'm.room.name': r.name = c.name || null; break;
    case 'm.room.avatar': r.avatar = c.url || null; break;
    case 'm.room.create': if (c.type === 'm.space') r.isSpace = true; break;
    case 'm.room.member':
      r.members.set(ev.state_key, { name: c.displayname, avatar: c.avatar_url, membership: c.membership }); break;
    case 'm.bridge': case 'uk.half-shot.bridge':
      r.net = netFrom(c.protocol && c.protocol.id) || r.net;
      if (c.channel) { r.bridgeName = c.channel.displayname || r.bridgeName; r.bridgeAvatar = c.channel.avatar_url || r.bridgeAvatar; r.channelId = c.channel.id || r.channelId; }
      break;
  }
}
function allOthers(r) {
  const ids = new Set(r.heroes);
  for (const [id, m] of r.members) {
    if (m.membership === 'join' || m.membership === 'invite') ids.add(id); else ids.delete(id);
  }
  ids.delete(S.userId);
  return [...ids];
}
const isBot = id => Object.keys(NETS).some(n => id === botId(n));
// people in the chat, not counting you or the hidden bridge bots
const others = r => allOthers(r).filter(id => !isBot(id));
function memberCount(r) {
  const bots = allOthers(r).filter(isBot).length;
  return r.joined ? Math.max(1, r.joined - bots) : others(r).length + 1;
}
function netOf(r) {
  if (r.net) return r.net;
  for (const id of others(r)) { const n = netFrom(id.split(':')[0]); if (n) return n; }
  return null;
}
function botNetOf(r) {
  const o = allOthers(r);
  if (o.length !== 1) return null;
  for (const n in NETS) if (o[0] === botId(n)) return n;
  return null;
}
const cleanName = n => (n || '').replace(/\s*\((WA|WhatsApp|IG|Instagram|FB|Facebook|Messenger)\)\s*$/i, '');
const memberName = (r, id) => {
  for (const n in NETS) if (id === botId(n)) return NETS[n].label;   // the bridge's helper account
  return cleanName((r.members.get(id) || {}).name) || id.split(':')[0].slice(1);
};
function roomName(r) {
  const b = botNetOf(r);
  if (b) return NETS[b].label + ' setup';
  if (r.name) return cleanName(r.name);
  if (r.bridgeName) return cleanName(r.bridgeName);
  const o = others(r);
  if (o.length) return o.slice(0, 4).map(id => memberName(r, id)).join(', ');
  return 'Chat';
}
function roomAvatar(r) {
  if (r.avatar) return r.avatar;
  if (r.bridgeAvatar) return r.bridgeAvatar;
  const o = others(r);
  if (o.length === 1) return (r.members.get(o[0]) || {}).avatar;
  return null;
}
const isGroup = r => memberCount(r) > 2;
const isPinned = r => !!(r.tags && r.tags['m.favourite']);
const isArchived = r => !!(r.tags && r.tags['m.lowpriority']);
const isUnread = r => r.unread > 0 || r.markedUnread;

// ---------- events ----------
const SHOWN = new Set(['m.room.message', 'm.sticker']);
function addEvent(r, ev, prepend = false) {
  if (ev.state_key !== undefined) { applyState(r, ev); return; }
  const c = ev.content || {};
  if (ev.type === 'm.room.redaction') {
    const tid = ev.redacts || c.redacts;
    const t = r.idx.get(tid);
    if (t) { t.redacted = true; return; }
    const re = r.reactIdx.get(tid);
    if (re) { const m = r.reacts.get(re.target); m && m.get(re.key) && m.get(re.key).delete(re.sender); }
    return;
  }
  if (ev.type === 'm.reaction') {
    const rel = c['m.relates_to'] || {};
    if (!rel.event_id || r.reactIdx.has(ev.event_id)) return;
    if (!r.reacts.has(rel.event_id)) r.reacts.set(rel.event_id, new Map());
    const m = r.reacts.get(rel.event_id);
    if (!m.has(rel.key)) m.set(rel.key, new Set());
    m.get(rel.key).add(ev.sender);
    r.reactIdx.set(ev.event_id, { target: rel.event_id, key: rel.key, sender: ev.sender });
    return;
  }
  if (!SHOWN.has(ev.type)) return;
  const rel = c['m.relates_to'];
  if (rel && rel.rel_type === 'm.replace') {
    const nc = c['m.new_content'];
    const t = r.idx.get(rel.event_id);
    if (t && nc) { t.content = nc; t.edited = true; } else if (nc) r.pendingEdits.set(rel.event_id, nc);
    return;
  }
  if (!ev.content || (!c.msgtype && ev.type === 'm.room.message')) { ev.redacted = true; }
  const txn = ev.unsigned && ev.unsigned.transaction_id;
  const existing = r.idx.get(ev.event_id) || (txn && r.txns.get(txn));
  if (existing) { Object.assign(existing, ev, { pending: false, failed: false }); r.idx.set(ev.event_id, existing); return; }
  if (r.pendingEdits.has(ev.event_id)) { ev.content = r.pendingEdits.get(ev.event_id); ev.edited = true; r.pendingEdits.delete(ev.event_id); }
  r.idx.set(ev.event_id, ev);
  if (prepend) r.events.unshift(ev); else r.events.push(ev);
  if (ev.origin_server_ts > r.lastTs) r.lastTs = ev.origin_server_ts;
}

function preview(r) {
  for (let i = r.events.length - 1; i >= 0; i--) {
    const ev = r.events[i];
    if (ev.redacted) continue;
    const me = ev.sender === S.userId ? 'You: ' : (isGroup(r) ? memberName(r, ev.sender).split(' ')[0] + ': ' : '');
    return me + bodyPreview(ev);
  }
  return '';
}
function bodyPreview(ev) {
  const c = ev.content || {};
  if (ev.type === 'm.sticker') return 'Sticker';
  const capt = mdPlain(captionOf(c)).replace(/\s+/g, ' ').trim();

// ---------- message actions (long-press a message) ----------
const QUICK = ['👍', '❤️', '😂', '😮', '😢', '🙏'];
function myReactions(r, ev) {
  const out = new Map();
  for (const [rid, x] of r.reactIdx) if (x.target === ev.event_id && x.sender === S.userId) out.set(x.key, rid);
  return out;
}
function removeReactionLocal(r, rid) {
  const x = r.reactIdx.get(rid); if (!x) return;
  r.reactIdx.delete(rid);
  const m = r.reacts.get(x.target); if (m && m.get(x.key)) m.get(x.key).delete(x.sender);
}
async function toggleReaction(r, ev, key) {
  if (!ev.event_id || ev.event_id.startsWith('~')) return;
  const mine = myReactions(r, ev);
  const redact = rid => { if (!rid.startsWith('~')) api('PUT', `/_matrix/client/v3/rooms/${enc(r.id)}/redact/${enc(rid)}/${newTxn()}`, {}).catch(() => {}); };
  if (mine.has(key)) { const rid = mine.get(key); removeReactionLocal(r, rid); renderTimeline(); redact(rid); return; }
  for (const rid of mine.values()) { removeReactionLocal(r, rid); redact(rid); }   // WhatsApp: one reaction per person
  const txn = newTxn(), tmp = '~' + txn;
  const content = { 'm.relates_to': { rel_type: 'm.annotation', event_id: ev.event_id, key } };
  addEvent(r, { event_id: tmp, type: 'm.reaction', sender: S.userId, content });
  renderTimeline();
  try {
    const res = await api('PUT', `/_matrix/client/v3/rooms/${enc(r.id)}/send/m.reaction/${txn}`, content);
    const x = r.reactIdx.get(tmp); if (x) { r.reactIdx.delete(tmp); r.reactIdx.set(res.event_id, x); }
  } catch { removeReactionLocal(r, tmp); renderTimeline(); toast('Could not react'); }
}
function messageActions(r, ev) {
  if (ev.redacted || ev.pending) return;
  const c = ev.content || {};
  const mine = ev.sender === S.userId;
  const isText = !c.msgtype || ['m.text', 'm.notice', 'm.emote'].includes(c.msgtype);
  const bot = !!botNetOf(r);
  const items = [];
  if (!bot) items.push({ label: 'Reply', icon: '↩︎', fn: () => startReply(r, ev) });
  if (isText) items.push({ label: 'Copy', icon: '⧉', fn: () => { navigator.clipboard && navigator.clipboard.writeText(stripReply(c.body || '')).then(() => toast('Copied'), () => toast('Could not copy')); } });
  if (mine && isText && !bot && ev.type === 'm.room.message') items.push({ label: 'Edit', icon: '✎', fn: () => startEdit(r, ev) });
  if (mine && !bot) items.push({ label: 'Delete for everyone', icon: '🗑', danger: true, fn: () => confirmDelete(r, ev) });
  openSheet({ title: bot ? '' : bodyPreview(ev), emojis: bot ? null : QUICK, mineEmoji: new Set(myReactions(r, ev).keys()), onEmoji: e => toggleReaction(r, ev, e), items });
}
function confirmDelete(r, ev) {

}
async function deleteMessage(r, ev) {

  try { await api('PUT', `/_matrix/client/v3/rooms/${enc(r.id)}/redact/${enc(ev.event_id)}/${newTxn()}`, {}); }

function startReply(r, ev) {

function clearCompose() {

  S.replyTo = null; S.editing = null; $('#replyBar').hidden = true;
  if (wasEditing) { $('#txt').value = ''; autosize(); }
}
async function editMessage(r, ev, text) {
  const old = ev.content, oldEdited = ev.edited;
  const content = { msgtype: 'm.text', body: '* ' + text, 'm.new_content': { msgtype: 'm.text', body: text }, 'm.relates_to': { rel_type: 'm.replace', event_id: ev.event_id } };
  ev.content = { ...old, body: text }; ev.edited = true; renderTimeline(); scheduleList();
  try { await api('PUT', `/_matrix/client/v3/rooms/${enc(r.id)}/send/m.room.message/${newTxn()}`, content); }
  catch { ev.content = old; ev.edited = oldEdited; renderTimeline(); toast('Could not edit (WhatsApp allows edits for 15 minutes)'); }

function sendComposer(text) {
  const r = S.rooms.get(S.current); if (!r || !text.trim()) return;
  if (S.editing) { const ev = S.editing; S.editing = null; $('#replyBar').hidden = true; editMessage(r, ev, text); return; }

// ---------- sending ----------
const newTxn = () => 'm' + Date.now() + Math.random().toString(36).slice(2, 8);
function addLocal(r, content, txn) {
  const ev = { event_id: '~' + txn, type: 'm.room.message', sender: S.userId, origin_server_ts: Date.now(), content, pending: true, txn };
  r.txns.set(txn, ev); r.idx.set(ev.event_id, ev); r.events.push(ev); r.lastTs = ev.origin_server_ts;
  renderTimeline(true); scheduleList();
  return ev;
}
async function putEvent(r, ev, content) {
  try {
    const res = await api('PUT', `/_matrix/client/v3/rooms/${enc(r.id)}/send/m.room.message/${ev.txn}`, content);
    if (ev.pending) { ev.event_id = res.event_id; ev.pending = false; r.idx.set(res.event_id, ev); }
  } catch { ev.failed = true; }
  if (r.id === S.current) renderTimeline();
}
function sendText(text) {
  const r = S.rooms.get(S.current); if (!r || !text.trim()) return;
  const content = { msgtype: 'm.text', body: withPrefix(r, text) };
  const txn = newTxn();
  putEvent(r, addLocal(r, content, txn), content);
}
function retry(r, ev) {
  if (!ev.failed || !ev.content || ev.content.msgtype === 'm.notice') return;
  ev.failed = false; ev.pending = true; ev.txn = newTxn(); r.txns.set(ev.txn, ev);
  renderTimeline(); putEvent(r, ev, ev.content);
}
async function toJpegIfHeic(file) {
  if (!/image\/hei[cf]/i.test(file.type) && !/\.hei[cf]$/i.test(file.name)) return file;
  try {
    const bmp = await createImageBitmap(file);
    const cv = document.createElement('canvas'); cv.width = bmp.width; cv.height = bmp.height;
    cv.getContext('2d').drawImage(bmp, 0, 0); bmp.close();
    const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.9));
    return new File([blob], file.name.replace(/\.hei[cf]$/i, '') + '.jpg', { type: 'image/jpeg' });
  } catch { return file; }
}
async function sendFile(file) {
  const r = S.rooms.get(S.current); if (!r) return;
  file = await toJpegIfHeic(file);
  const txn = newTxn();
  const ev = addLocal(r, { msgtype: 'm.notice', body: 'Uploading ' + file.name + '…' }, txn);
  try {
    const res = await fetch(`/_matrix/media/v3/upload?filename=${enc(file.name)}`, {
      method: 'POST', headers: { Authorization: 'Bearer ' + S.token, 'Content-Type': file.type || 'application/octet-stream' }, body: file });
    if (!res.ok) { const j = await res.json().catch(() => ({})); throw new Error(j.error || ('upload failed (' + res.status + ')')); }
    const { content_uri } = await res.json();
    const t = file.type || '';
    const msgtype = t.startsWith('image/') ? 'm.image' : t.startsWith('video/') ? 'm.video' : t.startsWith('audio/') ? 'm.audio' : 'm.file';
    const info = { mimetype: t, size: file.size };
    if (msgtype === 'm.image') { try { const bmp = await createImageBitmap(file); info.w = bmp.width; info.h = bmp.height; bmp.close(); } catch {} }
    const content = { msgtype, body: file.name, url: content_uri, info };
    ev.content = content;
    await putEvent(r, ev, content);
  } catch (e) { ev.failed = true; ev.pending = false; ev.content = { msgtype: 'm.notice', body: 'Could not send ' + file.name + ': ' + (e.message || 'error') }; renderTimeline(); }
}

async function openBotRoom(n, btn) {
  const bid = botId(n);
  const candidates = [...S.rooms.values()].filter(x => !x.isSpace && (botNetOf(x) === n ||
    ((x.members.get(bid) || {}).membership === 'join' && others(x).length === 0) || (x.heroes.includes(bid) && others(x).length === 0)));
  const isMgmt = x => x.events.some(e => /management room/i.test((e.content && e.content.body) || ''));
  let r = candidates.find(isMgmt) || candidates.sort((a, b) => b.events.length - a.events.length)[0];
  if (!r && S.firstSync) { btn.querySelector('small').textContent = 'Still loading your chats, try again in a moment'; return; }
  if (!r) {
    btn.querySelector('small').textContent = 'Opening…';
    try {

      r = room(res.room_id);
      r.heroes = [botId(n)];
      r.members.set(botId(n), { membership: 'invite', name: NETS[n].label + ' bridge' });
    } catch (e) { btn.querySelector('small').textContent = 'Could not reach the bridge: ' + e.message; return; }
  }
  openChat(r.id);
}

const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const pushSupported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
function notifState() {
  if (!pushSupported) return isIOS && !standalone ? 'Open Inbox from your Home Screen icon first' : 'Not supported in this browser';
  if (Notification.permission === 'denied') return 'Blocked — allow in Settings › Notifications › Inbox';
  if (Notification.permission === 'granted' && store.get('pushkey')) return 'On';
  return 'Off — tap to turn on';
}
function renderNotif() { $('#notifTxt').textContent = notifState(); }
function b64ToBytes(b64) {
  const s = atob((b64 + '='.repeat((4 - b64.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(s, c => c.charCodeAt(0));
}
async function enablePush() {
  if (!pushSupported || Notification.permission === 'denied') { renderNotif(); return; }
  const txt = $('#notifTxt');
  try {
    txt.textContent = 'Asking permission…';
    if (await Notification.requestPermission() !== 'granted') { renderNotif(); return; }
    txt.textContent = 'Setting up…';
    const reg = await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;
    const { publicKey } = await api('GET', '/push/vapid');
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(publicKey) });
    const { pushkey } = await api('POST', '/push/subscribe', { subscription: sub.toJSON() });
    await api('POST', '/_matrix/client/v3/pushers/set', {
      kind: 'http', app_id: 'inbox.web', pushkey, app_display_name: 'Inbox',
      device_display_name: isIOS ? 'iPhone' : 'Browser', lang: navigator.language || 'en',
      data: { url: 'http://pushgw:8080/_matrix/push/v1/notify' }, append: false,
    });
    store.set('pushkey', pushkey);
  } catch (e) { txt.textContent = 'Could not turn on: ' + (e.message || e); return; }
  renderNotif();
}

  return !id;

const PREF_KEY = 'inbox-prefs';
const FS = [['Small', 0.88], ['Default', 1], ['Large', 1.12], ['Extra large', 1.25]];
const THEMES = [['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']];
const ACCENTS = { mono: null, blue: '#0A84FF', green: '#1FA855', purple: '#8B5CF6', pink: '#E1306C' };
function getPrefs() { try { return Object.assign({ fs: 1, theme: 'auto', accent: 'mono' }, JSON.parse(store.get(PREF_KEY) || '{}')); } catch { return { fs: 1, theme: 'auto', accent: 'mono' }; } }
function applyPrefs() {
  const p = getPrefs(), root = document.documentElement;
  root.style.setProperty('--fs', p.fs);
  if (p.theme === 'auto') delete root.dataset.theme; else root.dataset.theme = p.theme;
  const a = ACCENTS[p.accent];

  else { root.style.removeProperty('--primary'); root.style.removeProperty('--primary-text'); }
  const dark = p.theme === 'dark' || (p.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelectorAll('meta[name=theme-color]').forEach(m => { m.content = dark ? '#000000' : '#F5F5F7'; m.removeAttribute('media'); });
}
function setPref(k, v) { const p = getPrefs(); p[k] = v; store.set(PREF_KEY, JSON.stringify(p)); applyPrefs(); renderAppearance(); }
function renderAppearance() {

    if (p.accent === k) b.className = 'on';

}

$('#back').onclick = () => { if (history.state && history.state.chat) history.back(); else closeChat(); };
window.onpopstate = () => { if (S.current) closeChat(); };
$('#logout').onclick = () => logout(false);
$('#notifBtn').onclick = enablePush;
const txt = $('#txt');
const autosize = () => { txt.style.height = 'auto'; txt.style.height = Math.min(txt.scrollHeight, 140) + 'px'; };
txt.oninput = autosize;
txt.onkeydown = e => {
  if (e.key === 'Enter' && !e.shiftKey && !matchMedia('(pointer:coarse)').matches) { e.preventDefault(); $('#comp').requestSubmit(); }
};
$('#comp').onsubmit = e => { e.preventDefault(); const v = txt.value; if (!v.trim()) return; txt.value = ''; autosize(); sendComposer(v); if (matchMedia('(pointer:coarse)').matches) txt.focus(); };
$('#rbClose').onclick = clearCompose;
$('#veil').onclick = closeSheetUI;
$('#file').onchange = e => { [...e.target.files].forEach(sendFile); e.target.value = ''; };
// paste photos / files straight into the message box
$('#txt').addEventListener('paste', e => {
  const files = [...((e.clipboardData && e.clipboardData.items) || [])].filter(i => i.kind === 'file').map(i => i.getAsFile()).filter(Boolean);
  if (!files.length) return;          // plain text paste works as normal
  e.preventDefault();
  const r = S.rooms.get(S.current); if (!r) return;
  const imgs = files.filter(f => (f.type || '').startsWith('image/')).length;
  const what = files.length === 1 ? (imgs ? 'this photo' : 'this file') : files.length + (imgs === files.length ? ' photos' : ' files');
  openSheet({ title: 'Send ' + what + ' to ' + roomName(r) + '?', items: [{ label: 'Send', icon: '↑', fn: () => files.forEach(sendFile) }] });
});
$('#tl').addEventListener('scroll', () => { const r = S.rooms.get(S.current); if (r && $('#tl').scrollTop < 80) loadOlder(r); }, { passive: true });
document.addEventListener('visibilitychange', () => { if (!document.hidden) markRead(); });

if (S.token && S.userId) start(); else $('#login').hidden = false;
checkVersion();
$('#lver').textContent = 'Version ' + APP_VERSION;
</script>
</body>
</html>
