# CaseDesk API. Runs next to My Inbox on the same server and is reached through
# My Inbox's Caddy (HTTPS) on its own domain. Secrets live in .env (never in GitHub).
name: casedesk
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    networks:
      inbox:
        aliases: [casedesk-api]
    mem_limit: 3g

networks:
  inbox:
    external: true
    name: ${INBOX_NET:-my-inbox_default}
