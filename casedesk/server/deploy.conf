# Public settings for the CaseDesk server (safe to keep in GitHub — no secrets here).
# The domain the app talks to. Create it free at duckdns.org (same account as vijayinbox).
CASEDESK_DOMAIN=casedeskapp.duckdns.org
# Website domains served from casedesk/site (HTTPS by the same Caddy). In Cloudflare DNS each one is a
# CNAME to the domain above, proxy OFF (grey cloud). api. is the future app API name.
SITE_DOMAINS=tharamaya.com,www.tharamaya.com,api.tharamaya.com
# Which Visa Bulletin chart USCIS accepts this month for employment-based I-485s: filing | final
USCIS_EB_CHART=filing
# Also load DOL PERM files (large). 1 = yes
INGEST_PERM=0
# Also load DOL LCA files (large; ~3 GB memory while loading). 1 = yes
INGEST_LCA=0
# Google sign-in for Community: paste the iOS OAuth client id here (it is public, not a secret).
# Leave empty to keep Google sign-in off. See casedesk/app/GOOGLE.md.
GOOGLE_CLIENT_ID=885132086293-472ihidqbu0ki9kst5aav0nqumie3l2g.apps.googleusercontent.com
# Support / moderation address shown on the support page and in the community rules (public).
MODERATION_EMAIL=hello@tharamaya.com
# Launch day: set this to a new word (e.g. launch-2026-12-01) and push. On restart the server moves the
# test Community posts and accounts, shared timelines and notification sign-ups into data/backup-before-<word>/
# and starts clean with only the Welcome post. Runs once per word. Leave empty until launch day.
LAUNCH_RESET=
